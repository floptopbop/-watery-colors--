<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>watercolor — slow depletion + splatter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100dvh;
    background:#c8c3b8;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #tray {
    position:fixed; left:0; right:0; bottom:0;
    padding:11px 14px calc(20px + env(safe-area-inset-bottom));
    background:rgba(38,34,30,0.88);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,0.12);
    display:flex; flex-direction:column; gap:9px;
    transform:translateY(100%); opacity:0;
    transition:transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease;
    z-index:10; touch-action:none;
  }
  #tray.visible { transform:translateY(0); opacity:1; }

  #swatchRow {
    display:flex; align-items:center; gap:7px; overflow-x:auto; padding:2px 0 1px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  #swatchRow::-webkit-scrollbar { display:none; }
  .swatch {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    border:2px solid rgba(255,255,255,0.2);
    transition:transform 0.16s, border-color 0.16s;
    touch-action:none; cursor:pointer;
  }
  .swatch.active {
    border-color:rgba(255,255,255,0.9); transform:scale(1.2);
    box-shadow:0 0 10px rgba(255,255,255,0.25);
  }

  .rowDiv { width:1px; height:24px; align-self:center; margin:0 4px; background:rgba(255,255,255,0.14); flex-shrink:0; }

  .size {
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.14);
    transition:transform 0.16s, border-color 0.16s; touch-action:none; cursor:pointer;
  }
  .size i { display:block; border-radius:50%; background:rgba(255,255,255,0.55); }
  .size.active { border-color:rgba(255,255,255,0.85); transform:scale(1.12); }
  .size.active i { background:rgba(255,255,255,0.92); }

  .ghost-btn {
    font-family:'Courier New', monospace; font-size:0.68rem; letter-spacing:0.1em;
    color:rgba(255,255,255,0.5); background:none; border:none; cursor:pointer;
    padding:6px 4px; transition:color 0.18s; white-space:nowrap;
  }
  .ghost-btn:hover { color:rgba(255,255,255,0.9); }

  #resetBtn {
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(216,138,118,0.55);
    background:rgba(120,58,48,0.2); color:rgba(242,204,194,0.9);
    font-size:16px; line-height:1; touch-action:none; cursor:pointer;
  }

  #dipRow { display:flex; gap:8px; height:65px; }
  .dip, #napkin {
    flex:1; border-radius:7px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', monospace;
    font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase;
    touch-action:none; cursor:pointer;
  }
  .dip .fill {
    position:absolute; left:0; bottom:0; right:0; height:100%;
    background:rgba(255,255,255,0.25); transition:height 0.1s linear; pointer-events:none;
  }
  .dip span, #napkin .napLabel { position:relative; z-index:2; pointer-events:none; font-weight:bold; }
  #dipInk   { background:#141210; color:#eee; border:1px solid rgba(255,255,255,0.15); }
  #dipWater { background:#2e5d8a; color:#eaf2fa; border:1px solid rgba(255,255,255,0.15); }

  #napkin { background:#e8e4d8; color:#5a5348; border:1px solid rgba(0,0,0,0.1); }
  .napZones { position:absolute; inset:0; display:flex; z-index:1; }
  .napZone { flex:1; touch-action:none; cursor:pointer; }
  .napZone.mid { border-left:1px solid rgba(90,83,72,0.18); border-right:1px solid rgba(90,83,72,0.18); }
  .napZone.pressed { background:rgba(90,83,72,0.25); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="tray" class="visible">
  <div id="swatchRow">
    <div class="swatch active" style="background:#2a2420" data-ink="#2a2420"></div>
    <div class="swatch" style="background:#3d1f14" data-ink="#3d1f14"></div>
    <div class="swatch" style="background:#141c24" data-ink="#141c24"></div>
    <div class="swatch" style="background:#14281D" data-ink="#14281D"></div>
    <div class="swatch" style="background:#4a1a1a" data-ink="#4a1a1a"></div>
    <div class="rowDiv"></div>
    <div class="size" data-r="3"><i style="width:4px;height:4px"></i></div>
    <div class="size active" data-r="8"><i style="width:9px;height:9px"></i></div>
    <div class="size" data-r="16"><i style="width:15px;height:15px"></i></div>
    <div class="rowDiv"></div>
    <button class="ghost-btn" id="btnUndo">undo</button>
    <button id="resetBtn" title="Reset Canvas">↺</button>
  </div>

  <div id="dipRow">
    <div class="dip" id="dipInk"><div class="fill" id="inkFill"></div><span>ink</span></div>
    <div id="napkin">
      <div class="napZones">
        <div class="napZone" data-drain="ink" title="Drain Ink"></div>
        <div class="napZone mid" data-drain="both" title="Dab Both"></div>
        <div class="napZone" data-drain="water" title="Drain Water"></div>
      </div>
      <span class="napLabel">napkin</span>
    </div>
    <div class="dip" id="dipWater"><div class="fill" id="waterFill"></div><span>water</span></div>
  </div>

  <div style="display:flex; justify-content:flex-end;">
    <button class="ghost-btn" id="btnTilt">tilt</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── TUNABLES ────────────────────────────────────────────────
const DRY_SECONDS = 10.0;
const BRUSH_DRAIN_PER_STEP = 0.000001;
const MAX_BRUSH_R = 8;           // default max radius (changed by size buttons)
const MIN_BRUSH_R = 1;
let BRUSH_R = MAX_BRUSH_R;       // current max brush radius

let waterLoad = 0.8;
let inkLoad = 0.95;

let inkR = 0x2a, inkG = 0x24, inkB = 0x20;   // sumi default

function setInk(hex) {
  inkR = parseInt(hex.slice(1,3),16);
  inkG = parseInt(hex.slice(3,5),16);
  inkB = parseInt(hex.slice(5,7),16);
}

// ── DETERMINISTIC RANDOM ────────────────────────────────────
const R2A=0.7548776662466927,R2B=0.5698402909980532,GOLD=Math.PI*(3-Math.sqrt(5));
const fract=x=>x-Math.floor(x);
const dU=(a,b)=>fract(Math.sin(a*127.1+b*311.7)*43758.5453123);
const dS=(a,b)=>dU(a,b)*21;
const dG=(a,b)=>(dU(a,b)+dU(a+1.618,b+3.14)+dU(a+2.71,b+1.41)-1.5)*1.15;

// ── PAPER GENERATION (sumi‑e style) ─────────────────────────
const paperCanvas = document.createElement('canvas');
const paperCtx = paperCanvas.getContext('2d');

function generatePaper() {
  const w=canvas.width, h=canvas.height;
  paperCanvas.width=w; paperCanvas.height=h;
  paperCtx.clearRect(0,0,w,h);
  paperCtx.fillStyle='#f4f1ea';
  paperCtx.fillRect(0,0,w,h);

  const area=w*h;
  const fiberCount=Math.floor(area/3800);
  paperCtx.strokeStyle='rgba(55,45,35,0.014)';
  for(let i=1;i<=fiberCount;i++){
    const x=fract(i*R2A)*w, y=fract(i*R2B)*h, ang=i*GOLD;
    const len=25+dU(i,7.3)*110;
    paperCtx.lineWidth=0.18+dU(i,11.1)*0.65;
    paperCtx.beginPath();
    paperCtx.moveTo(x,y);
    paperCtx.bezierCurveTo(
      x+Math.cos(ang)*(len/3)+dS(i,1.2)*4, y+Math.sin(ang)*(len/3)+dS(i,2.3)*4,
      x+Math.cos(ang)*(len*2/3)+dS(i,3.4)*4, y+Math.sin(ang)*(len*2/3)+dS(i,4.5)*4,
      x+Math.cos(ang)*len, y+Math.sin(ang)*len);
    paperCtx.stroke();
  }

  const moteCount=Math.floor(area/130);
  paperCtx.fillStyle='rgba(130,115,95,0.02)';
  for(let i=1;i<=moteCount;i++){
    const rx=fract((i+0.5)*R2A)*w, ry=fract((i+0.5)*R2B)*h;
    paperCtx.beginPath();
    paperCtx.arc(rx,ry,dU(i,5.5)*1.6,0,Math.PI*2);
    paperCtx.fill();
  }

  const grad=paperCtx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.22, w/2,h/2,Math.max(w,h)*0.6);
  grad.addColorStop(0,'rgba(255,255,255,0)');
  grad.addColorStop(1,'rgba(170,160,145,0.12)');
  paperCtx.fillStyle=grad;
  paperCtx.fillRect(0,0,w,h);

  // hanko stamp
  const size=Math.max(48, Math.min(w,h)*0.06);
  const sx=w-size-40, sy=h-size-40;
  paperCtx.save();
  paperCtx.fillStyle='rgba(160,24,24,0.55)';
  paperCtx.strokeStyle='rgba(160,24,24,0.55)';
  paperCtx.lineWidth=size*0.06;
  const pad=size*0.08;
  paperCtx.strokeRect(sx+pad,sy+pad,size-pad*2,size-pad*2);
  paperCtx.font=`bold ${size*0.55}px "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif`;
  paperCtx.textAlign='center';
  paperCtx.textBaseline='middle';
  paperCtx.fillText('像', sx+size/2, sy+size/2+size*0.03);
  paperCtx.restore();
}

// ── INK CANVAS (permanent strokes + settled splatter) ───────
const inkCanvas = document.createElement('canvas');
const inkCtx = inkCanvas.getContext('2d');
inkCanvas.width=canvas.width; inkCanvas.height=canvas.height;

// ── WATER TABLE ─────────────────────────────────────────────
const WATER={
  cell:1, deposit:10, linger:0.8, drySec:4, bleedAt:0.8, dripAt:.85,
  bloomCooldown:900, dripMax:999, dripLen:900, dripSpeed:0.8, dripWobble:0,
  dripSpend:0.75, channelPull:11, channelAt:0.9, sip:0.5, bloomGrow:1100,
  gravMin:0.34
};
let wetW, wetH, wetSat, wetGrp, wetBloomT;
function setupWaterGrid() {
  wetW=Math.max(1,Math.ceil(canvas.width/WATER.cell));
  wetH=Math.max(1,Math.ceil(canvas.height/WATER.cell));
  wetSat=new Float32Array(wetW*wetH);
  wetGrp=new Int32Array(wetW*wetH);
  wetBloomT=new Float64Array(wetW*wetH);
}
function cellAt(x,y){
  const cx=Math.min(wetW-1,Math.max(0,Math.floor(x/WATER.cell)));
  const cy=Math.min(wetH-1,Math.max(0,Math.floor(y/WATER.cell)));
  return cy*wetW+cx;
}
function depositWet(x,y,amt,wpx,group,surfGroup,quiet){
  if(!wetSat)return;
  const i=cellAt(x,y),now=performance.now();
  const wasWet=wetSat[i];
  const foreign=wetGrp[i]!==0&&wetGrp[i]!==group;
  wetSat[i]=Math.min(1.5,wetSat[i]+amt);
  const s=amt*0.3;
  const cx=i%wetW;
  if(cx>0)wetSat[i-1]=Math.min(1.5,wetSat[i-1]+s);
  if(cx<wetW-1)wetSat[i+1]=Math.min(1.5,wetSat[i+1]+s);
  if(i-wetW>=0)wetSat[i-wetW]=Math.min(1.5,wetSat[i-wetW]+s);
  if(i+wetW<wetSat.length)wetSat[i+wetW]=Math.min(1.5,wetSat[i+wetW]+s);
  wetGrp[i]=group;
  if(quiet)return;
  if(foreign&&wasWet>WATER.bleedAt&&now-wetBloomT[i]>WATER.bloomCooldown){
    wetBloomT[i]=now;
    spawnBloom(x,y,12+wasWet*30+wpx*0.4,surfGroup);
  }
  if(wetSat[i]>=WATER.dripAt){
    const nb=((cx>0?wetSat[i-1]:0)+(cx<wetW-1?wetSat[i+1]:0)+(i-wetW>=0?wetSat[i-wetW]:0)+(i+wetW<wetSat.length?wetSat[i+wetW]:0))/4;
    const soak=Math.min(1,wetSat[i]*0.55+nb*0.6);
    wetSat[i]-=0.6;
    if(grav.mag>WATER.gravMin){
      spawnDrip(x,y,wpx,surfGroup,soak);
    }else if(now-wetBloomT[i]>WATER.bloomCooldown){
      wetBloomT[i]=now;
      spawnBloom(x,y,16+wasWet*26+wpx*0.5,surfGroup);
    }
  }
}
function decayWet(now){
  if(!wetSat)return;
  const dt=Math.min(120,now-(wetLastT||now));
  wetLastT=now;
  const d=dt/(WATER.drySec*1000);
  for(let i=0;i<wetSat.length;i++){
    if(wetSat[i]>0){
      wetSat[i]-=d;
      if(wetSat[i]<=0){wetSat[i]=0;wetGrp[i]=0;}
    }
  }
}
let wetLastT=0;
let drips=[], blooms=[];
class Bloom{
  constructor(x,y,size,group){
    this.x=x;this.y=y;this.size=Math.min(64,size);this.group=group;
    const seed=Math.floor(x)*3.3+Math.floor(y)*8.9;
    this.p1=dU(seed,4.4)*Math.PI*2;
    this.p2=dU(seed,5.5)*Math.PI*2;
    this.a1=0.12+dU(seed,6.6)*0.1;
    this.a2=0.06+dU(seed,7.7)*0.08;
    this.born=performance.now();
    this.dur=WATER.bloomGrow*50;
    this.rPrev=0;
    this.alive=true;
  }
  edge(r){
    const bx=this.x,by=this.y;
    inkCtx.beginPath();
    const STEPS=26;
    for(let i=0;i<=STEPS;i++){
      const t=(i/STEPS)*Math.PI*2;
      const rr=r*(1+Math.sin(t*3+this.p1)*this.a1+Math.sin(t*5+this.p2)*this.a2);
      const px=bx+Math.cos(t)*rr,py=by+Math.sin(t)*rr;
      i?inkCtx.lineTo(px,py):inkCtx.moveTo(px,py);
    }
    inkCtx.closePath();
  }
  step(now){
    const p=Math.min(1,(now-this.born)/this.dur);
    const r=this.size*(Math.pow(p,1.8)*0.95);
    if(r-this.rPrev<0.2&&p<1)return;
    const mid=Math.max(0.3,(r+this.rPrev)/2);
    const a=0.0001*(1-(mid/this.size)*0.68);
    inkCtx.strokeStyle=`rgba(${inkR},${inkG},${inkB},${Math.max(0.008,a)})`;
    inkCtx.lineWidth=Math.max(0.7,(r-this.rPrev)*0.8);
    this.edge(mid);
    inkCtx.stroke();
    this.rPrev=r;
    if(p>=1)this.alive=false;
  }
}
function spawnBloom(x,y,size,group){
  if(blooms.length>=12)return;
  blooms.push(new Bloom(x,y,size,group));
}
class Drip{
  constructor(x,y,water,w,group,maxDist,cap){
    this.x=x;this.y=y;this.water=water;this.w=w;this.group=group;
    this.maxDist=maxDist;this.cap=cap;this.dist=0;this.alive=true;
    this.locked=false;this.lockX=x;this.lockY=y;this.lockDir={x:0,y:1};
  }
  step(){
    const m=Math.max(grav.mag,0.05);
    const sp=WATER.dripSpeed*(0.3+0.65*this.water)*m;
    let gx=grav.x/m, gy=grav.y/m;
    const nextX=this.x+gx*sp, nextY=this.y+gy*sp;
    const nextCell=cellAt(nextX,nextY);
    const nextWet=wetSat[nextCell];
    if(nextWet>WATER.channelAt&&!this.locked){
      this.locked=true;this.lockX=nextX;this.lockY=nextY;this.lockDir={x:gx,y:gy};
    }
    if(this.locked){
      const lockCell=cellAt(this.lockX,this.lockY);
      const lockWet=wetSat[lockCell];
      if(nextWet>lockWet*1.3&&nextWet>WATER.channelAt){
        this.lockDir={x:gx,y:gy};
      }
      gx=this.lockDir.x;gy=this.lockDir.y;
    }
    const wob=Math.sin(this.dist*0.12+this.x*7.3)*WATER.dripWobble;
    const px=this.x,py=this.y;
    this.x+=(gx-gy*wob)*sp;this.y+=(gy+gx*wob)*sp;
    this.dist+=sp;
    const wNow=Math.max(0.3,this.w*Math.pow(Math.max(0,this.water),0.6));
    inkCtx.strokeStyle=`rgba(${inkR},${inkG},${inkB},${this.cap*(0.5+0.4*this.water)})`;
    inkCtx.lineWidth=wNow;
    inkCtx.lineCap='round';
    inkCtx.beginPath();inkCtx.moveTo(px,py);inkCtx.lineTo(this.x,this.y);inkCtx.stroke();
    depositWet(this.x,this.y,0.000001,wNow,this.group,this.group,true);
    this.water-=WATER.dripSpend;
    const out=this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height;
    if(this.water<=0.08||this.dist>=this.maxDist||out){
      inkCtx.fillStyle=`rgba(${inkR},${inkG},${inkB},${this.cap*0.85})`;
      inkCtx.beginPath();inkCtx.arc(this.x,this.y,wNow*1.15,0,Math.PI*2);inkCtx.fill();
      this.alive=false;
    }
  }
}
function spawnDrip(x,y,wpx,group,soak=0.7){
  if(drips.length>=WATER.dripMax)return;
  const seed=Math.floor(x)*5.7+Math.floor(y)*9.1;
  const water=soak*(0.7+dU(seed,3.1)*0.3);
  const maxDist=WATER.dripLen*(0.25+soak*soak*0.95);
  drips.push(new Drip(x,y,water,Math.max(1.1,wpx*0.14),group,maxDist,curInkAlpha||0.5));
}

// ── GRAVITY (gyro) ──────────────────────────────────────────
let grav={x:0,y:0.55,mag:0.55},gyroLive=false;
function armGyro(done){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(state=>done(state==='granted'))
      .catch(()=>done(false));
  }else{
    setTimeout(()=>done(gyroLive),300);
  }
}
window.addEventListener('deviceorientation',e=>{
  if(e.beta===null||e.gamma===null)return;
  gyroLive=true;
  const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
  const ang=(((screen.orientation&&screen.orientation.angle)??window.orientation)||0)*Math.PI/180;
  const ca=Math.cos(ang),sa=Math.sin(ang);
  const rx=Math.sin(g)*ca+Math.sin(b)*sa;
  const ry=Math.sin(b)*ca-Math.sin(g)*sa;
  const m=Math.min(1,Math.hypot(rx,ry));
  grav.x+=(rx-grav.x)*0.12;grav.y+=(ry-grav.y)*0.12;grav.mag+=(m-grav.mag)*0.12;
});

// ── SPLATTER & PARTICLES ────────────────────────────────────
let particles=[],ripple=null,curInkAlpha=0.8;
const maxParticles=500;
class InkParticle{
  constructor(x,y,vx,vy,radius,r,g,b,id){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.radius=radius;
    this.r=r;this.g=g;this.b=b;this.id=id;this.alpha=0.88;
    this.friction=0.9;this.gravity=0;this.decay=0.0002+dU(id,9.4)*0.0001;
    this.settled=false;
  }
  update(){
    if(this.settled)return;
    this.x+=this.vx;this.y+=this.vy;
    this.vx*=this.friction;this.vy*=this.friction;this.vy+=this.gravity;
    this.alpha-=this.decay;
    const spd=Math.hypot(this.vx,this.vy);
    if(this.alpha<=0.03||spd<0.06){
      this.settled=true;
      inkCtx.globalAlpha=Math.max(0.01,this.alpha*0.9);
      inkCtx.fillStyle=`rgb(${this.r},${this.g},${this.b})`;
      inkCtx.beginPath();
      inkCtx.arc(this.x,this.y,this.radius*1.5,0,Math.PI*2);
      inkCtx.fill();
      inkCtx.globalAlpha=1;
    }
  }
  draw(ctx){
    if(this.settled)return;
    ctx.fillStyle=`rgba(${this.r},${this.g},${this.b},${this.alpha})`;
    if(Math.hypot(this.vx,this.vy)>0.8){
      ctx.lineWidth=this.radius*1.7;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(this.x-this.vx*2.2,this.y-this.vy*2.2);
      ctx.lineTo(this.x,this.y);
      ctx.strokeStyle=ctx.fillStyle;
      ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fill();
    }
  }
}
function spawnSplat(px,py,angle,spd,group){
  if(particles.length>=maxParticles)return;
  const seed=Math.floor(px)*3.1+Math.floor(py)*7.7+Math.floor(angle*57.3)*13.9;
  const cnt=Math.min(18,Math.floor(spd*2));
  if(cnt<2)return;
  const refSize=Math.min(52,spd*34);
  for(let i=0;i<cnt;i++){
    const a=angle+dG(seed,i*2.39996)*0.12;
    const v=spd*1.6*(0.4+dU(seed+1.3,i)*0.5);
    const rad=Math.max(0.35,(0.15+dU(seed+2.6,i)*0.85)*refSize*0.08);
    if(particles.length<maxParticles){
      particles.push(new InkParticle(px,py,Math.cos(a)*v,Math.sin(a)*v,rad,inkR,inkG,inkB,seed+i));
    }
  }
}

// ── BRUSH & INPUT ───────────────────────────────────────────
let pts=[], smSpd=0, paintGroup=0, drawing=false, prevPt=null, lastMoveT=0;
let undoStack=[];
function snapUndo(){
  undoStack.push(inkCanvas.toDataURL());
  if(undoStack.length>20)undoStack.shift();
}
function performUndo(){
  if(!undoStack.length)return;
  const img=new Image();
  img.onload=()=>{ inkCtx.clearRect(0,0,canvas.width,canvas.height); inkCtx.drawImage(img,0,0); };
  img.src=undoStack.pop();
}

function paintSegment(p1,p2){
  const dist=Math.hypot(p2.x-p1.x,p2.y-p1.y)||1;
  const dt=Math.min(40,Math.max(8,(p2.t-p1.t)||16));
  const raw=dist/dt;
  const prev=smSpd||raw;
  smSpd=prev+(raw-prev)*0.5; // speedSmooth=0.5
  const stepDist=0.8;
  const steps=Math.max(1,Math.floor(dist/stepDist));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const x=p1.x+(p2.x-p1.x)*t, y=p1.y+(p2.y-p1.y)*t;
    const spd=prev+(smSpd-prev)*t;
    const range=BRUSH_R-MIN_BRUSH_R;
    const w=MIN_BRUSH_R+range/(1.0+spd*4.5);
    const opacity=0.15+0.75/(1.0+spd*7.0);
    const inkA=opacity*inkLoad;
    if(inkA>0.01){
      inkCtx.beginPath();
      inkCtx.arc(x,y,w,0,Math.PI*2);
      inkCtx.fillStyle=`rgba(${inkR},${inkG},${inkB},${inkA*0.28})`;
      inkCtx.fill();
    }
    const waterAmt=WATER.deposit*waterLoad*opacity*Math.min(1.6,Math.max(0.35,w/14));
    depositWet(x,y,waterAmt,w,paintGroup,paintGroup,false);
    waterLoad=Math.max(0,waterLoad-BRUSH_DRAIN_PER_STEP);
    inkLoad=Math.max(0,inkLoad-BRUSH_DRAIN_PER_STEP);
  }
}

function startStroke(x,y,t){
  snapUndo();
  smSpd=0;
  paintGroup=++groupSeq;
  pts=[{x,y,t}];
  drawing=true;
}
function extendStroke(x,y,t){
  if(!drawing)return;
  const last=pts[pts.length-1];
  if(Math.hypot(x-last.x,y-last.y)<1.0)return;
  const p={x,y,t};
  pts.push(p);
  paintSegment(last,p);
}
function endStroke(tEnd){
  if(!drawing)return;
  drawing=false;
  if(pts.length>=3){
    const last=pts[pts.length-1];
    const prev=pts[Math.max(0,pts.length-8)];
    const dx=last.x-prev.x,dy=last.y-prev.y;
    const dt=(last.t-prev.t)||1;
    const spd=Math.hypot(dx,dy)/dt*15;
    const ang=Math.atan2(dy,dx);
    if(spd>1.2){
      spawnSplat(last.x,last.y,ang,spd,0);
      ripple={x:last.x,y:last.y,radius:1,opacity:0.56};
    }
  }
  pts=[];
  updateUIIndicators();
}

function lingeringDeposit(){
  if(drawing&&pts.length){
    const p=pts[pts.length-1];
    depositWet(p.x,p.y,WATER.linger,9,paintGroup,paintGroup,false);
  }
}

// ── EVENT HANDLERS ──────────────────────────────────────────
function updateUIIndicators(){
  document.getElementById('inkFill').style.height=(inkLoad*100)+'%';
  document.getElementById('waterFill').style.height=(waterLoad*100)+'%';
}
let groupSeq=0;
canvas.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.target!==canvas)return;
  e.preventDefault();
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  lastMoveT=e.timeStamp;
  startStroke(e.clientX,e.clientY,e.timeStamp);
});
canvas.addEventListener('pointermove',e=>{
  if(!drawing||!e.isPrimary)return;
  const list=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  const t1=e.timeStamp,t0=lastMoveT||(t1-16);
  const step=Math.max(0,(t1-t0)/list.length);
  for(let k=0;k<list.length;k++){
    const ev=list[k];
    extendStroke(ev.clientX,ev.clientY,t0+step*(k+1));
  }
  lastMoveT=t1;
});
window.addEventListener('pointerup',()=>{if(drawing)endStroke(performance.now());});
window.addEventListener('pointercancel',()=>{drawing=false;pts=[];});

// ── UI CONTROLS ─────────────────────────────────────────────
document.querySelectorAll('.swatch').forEach(sw=>{
  sw.addEventListener('click',()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
    setInk(sw.dataset.ink);
    inkLoad=Math.min(1.0,inkLoad+0.5);
    updateUIIndicators();
  });
});
document.querySelectorAll('.size').forEach(sz=>{
  sz.addEventListener('click',()=>{
    document.querySelectorAll('.size').forEach(s=>s.classList.remove('active'));
    sz.classList.add('active');
    BRUSH_R=parseFloat(sz.dataset.r);
  });
});
document.getElementById('dipInk').addEventListener('click',()=>{inkLoad=1;updateUIIndicators();});
document.getElementById('dipWater').addEventListener('click',()=>{waterLoad=1;updateUIIndicators();});
document.querySelectorAll('.napZone').forEach(zone=>{
  zone.addEventListener('pointerdown',()=>zone.classList.add('pressed'));
  zone.addEventListener('pointerup',()=>zone.classList.remove('pressed'));
  zone.addEventListener('pointerleave',()=>zone.classList.remove('pressed'));
  zone.addEventListener('click',()=>{
    const type=zone.dataset.drain;
    if(type==='ink'||type==='both')inkLoad=Math.max(0,inkLoad-0.4);
    if(type==='water'||type==='both')waterLoad=Math.max(0,waterLoad-0.4);
    updateUIIndicators();
  });
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  inkCtx.clearRect(0,0,canvas.width,canvas.height);
  drips=[];blooms=[];particles=[];
  if(wetSat){wetSat.fill(0);wetGrp.fill(0);}
  undoStack=[];
});
document.getElementById('btnUndo').addEventListener('click',performUndo);
document.getElementById('btnTilt').addEventListener('click',()=>{
  armGyro(ok=>{
    alert(ok?'Gyro active – drips will flow with tilt':'No gyro available');
  });
});

// ── RESIZE ──────────────────────────────────────────────────
function resize(){
  const keep=document.createElement('canvas');
  keep.width=inkCanvas.width;keep.height=inkCanvas.height;
  keep.getContext('2d').drawImage(inkCanvas,0,0);
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  inkCanvas.width=canvas.width;inkCanvas.height=canvas.height;
  inkCtx.drawImage(keep,0,0);
  generatePaper();
  setupWaterGrid();
}
window.addEventListener('resize',resize);

// ── RENDER LOOP ─────────────────────────────────────────────
const bleedCanvas=document.createElement('canvas');
const bleedCtx=bleedCanvas.getContext('2d');
function frame(now){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(paperCanvas,0,0);

  // bleed halo
  bleedCanvas.width=canvas.width;bleedCanvas.height=canvas.height;
  bleedCtx.clearRect(0,0,bleedCanvas.width,bleedCanvas.height);
  bleedCtx.save();
  bleedCtx.filter='blur(6px)';
  bleedCtx.globalAlpha=0.05;
  bleedCtx.drawImage(inkCanvas,0,0);
  bleedCtx.restore();
  ctx.globalCompositeOperation='multiply';
  ctx.drawImage(bleedCanvas,0,0);
  ctx.globalCompositeOperation='source-over';

  // permanent ink
  ctx.drawImage(inkCanvas,0,0);

  // airborne particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.update();
    p.draw(ctx);
    if(p.settled)particles.splice(i,1);
  }

  // drips & blooms
  for(let i=drips.length-1;i>=0;i--){
    drips[i].step();
    if(!drips[i].alive)drips.splice(i,1);
  }
  for(let i=blooms.length-1;i>=0;i--){
    blooms[i].step(now);
    if(!blooms[i].alive)blooms.splice(i,1);
  }

  decayWet(now);
  lingeringDeposit();

  if(ripple){
    ctx.strokeStyle=`rgba(${inkR},${inkG},${inkB},${ripple.opacity})`;
    ctx.lineWidth=0.7;
    ctx.beginPath();ctx.arc(ripple.x,ripple.y,ripple.radius,0,Math.PI*2);ctx.stroke();
    ripple.radius+=2.6;ripple.opacity-=0.018;
    if(ripple.opacity<=0)ripple=null;
  }
  requestAnimationFrame(frame);
}

// ── TRAY TOGGLE ─────────────────────────────────────────────
const tray=document.getElementById('tray');
let trayOpen=true;
canvas.addEventListener('dblclick',()=>{tray.classList.toggle('visible');trayOpen=!trayOpen;});
let tapCount=0,tapTimer=null;
canvas.addEventListener('touchstart',e=>{
  tapCount++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{tapCount=0;},320);
  if(tapCount>=2){tapCount=0;tray.classList.toggle('visible');trayOpen=!trayOpen;}
},{passive:true});

// ── INIT ────────────────────────────────────────────────────
function init(){
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  inkCanvas.width=canvas.width;inkCanvas.height=canvas.height;
  generatePaper();
  setupWaterGrid();
  updateUIIndicators();
  requestAnimationFrame(frame);
}
init();
</script>
