<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sumi-e — living water on stone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100dvh;
            background: #c8c3b8;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        /* ── tap-to-reveal tray ── */
        #tray {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 20px 28px;
            background: rgba(38, 34, 30, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            transform: translateY(100%);
            opacity: 0;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        #tray.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* ink swatches */
        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.16);
            flex-shrink: 0;
            transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
            position: relative;
        }
        .swatch:hover {
            transform: scale(1.15);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .swatch.active {
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.25);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
        }

        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.13);
            flex-shrink: 0;
        }

        /* ghost text buttons */
        .ghost-btn {
            font-family: 'Courier New', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.5);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            transition: color 0.18s;
            white-space: nowrap;
        }
        .ghost-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .sp {
            flex: 1;
        }

        /* hint text */
        #hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            color: rgba(70, 60, 50, 0.25);
            pointer-events: none;
            transition: opacity 1.8s ease;
            text-align: center;
            line-height: 2.4;
            z-index: 5;
        }
        #hint.gone {
            opacity: 0;
        }
        #hint span {
            font-size: 0.55rem;
            letter-spacing: 0.28em;
            color: rgba(70, 60, 50, 0.15);
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div id="hint">
        water on stone<br>
        <span>trace the moment — it fades</span>
    </div>

    <div id="tray">
        <div class="swatch active" style="background:#2a2420" data-ink="#2a2420" title="sumi"></div>
        <div class="swatch" style="background:#3d1f14" data-ink="#3d1f14" title="sepia"></div>
        <div class="swatch" style="background:#141c24" data-ink="#141c24" title="indigo"></div>
        <div class="swatch" style="background:#14281D" data-ink="#14281D" title="charcoal"></div>
        <div class="swatch" style="background:#4a1a1a" data-ink="#4a1a1a" title="cinnabar"></div>

        <div class="divider"></div>

        <button class="ghost-btn" id="btnUndo">undo</button>
        <button class="ghost-btn" id="btnClear">clear</button>

        <div class="sp"></div>

        <button class="ghost-btn" id="btnSave">save</button>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');
        const tray = document.getElementById('tray');

        // ── THE TUNING DIALS / KNOBS ─────────────────────────────
        const CONFIG = {
            // How fast the water completely dries up (Lower = lasts longer)
            // Try 0.0015 for a super slow, meditative fade!
            evaporationSpeed: 0.0042, 

            // Controls the physical "pooling" limits when your finger pauses.
            // minBrushWidth: Minimum thickness when moving lightning fast
            // maxBrushWidth: Maximum thickness when perfectly stationary
            minBrushWidth: .01,
            maxBrushWidth: 15.0, 

            // Wet-ink bleeding settings
            bleedStrength: .0000001,   // How far water creeps outward into the stone fibers
            bleedOpacity: 0.6,   // Softness of the bleeding edge halo
            
            // Gyroscopic gravity impact (drift speed for drips/mist on mobile tilt)
            gyroInfluence: 0.01,
            
            hankoColor: 'rgba(160, 24, 24, 0.45)',
            hankoSymbol: '像',
        };

        // ── OFFSCREEN BUFFERS ────────────────────────────────────
        const paperCanvas = document.createElement('canvas');
        const paperCtx = paperCanvas.getContext('2d');

        const drawingCanvas = document.createElement('canvas');
        const drawingCtx = drawingCanvas.getContext('2d');

        const bleedCanvas = document.createElement('canvas');
        const bleedCtx = bleedCanvas.getContext('2d');

        function setupBuffers() {
            const w = canvas.width;
            const h = canvas.height;
            [paperCanvas, drawingCanvas, bleedCanvas].forEach(c => {
                c.width = w;
                c.height = h;
            });
        }

        // ── STATE ────────────────────────────────────────────────
        let inkHex = '#2a2420';
        let inkRgb = { r: 42, g: 36, b: 32 };
        let pts = [];
        let drawing = false;
        let particles = [];
        let ripple = null;
        let hintGone = false;
        let trayOpen = false;
        let trayTimer = null;

        // Gravity telemetry vectors
        let gravityX = 0;
        let gravityY = 0.1; // Slight default downward gravity drift

        // ── UNDO STACK ───────────────────────────────────────────
        let undoStack = [];

        function snapUndo() {
            undoStack.push(drawingCanvas.toDataURL());
            if (undoStack.length > 20) undoStack.shift();
        }

        function performUndo() {
            if (!undoStack.length) return;
            const img = new Image();
            img.onload = () => {
                drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                drawingCtx.drawImage(img, 0, 0);
            };
            img.src = undoStack.pop();
        }

        // ── INK HELPERS ──────────────────────────────────────────
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function setInkColor(hex) {
            inkHex = hex;
            inkRgb = hexToRgb(hex);
        }

        function inkAt(alpha) {
            const { r, g, b } = inkRgb;
            return `rgba(${r},${g},${b},${Math.min(1, alpha)})`;
        }

        // ── WASHI PAPER GENERATOR (Clean Warm Stone) ─────────────
        function generateWashiPaper() {
            const w = paperCanvas.width;
            const h = paperCanvas.height;

            paperCtx.fillStyle = '#f2eee5';
            paperCtx.fillRect(0, 0, w, h);

            // Subtle paper fibers
            const area = w * h;
            const fiberCount = Math.floor(area / 3000);
            paperCtx.strokeStyle = 'rgba(60, 50, 40, 0.012)';
            for (let i = 0; i < fiberCount; i++) {
                paperCtx.lineWidth = Math.random() * 0.15 + 0.05;
                paperCtx.beginPath();
                const x = Math.random() * w;
                const y = Math.random() * h;
                const length = Math.random() * 12 + 2;
                const angle = Math.random() * Math.PI * 2;
                paperCtx.moveTo(x, y);
                paperCtx.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
                paperCtx.stroke();
            }

            // Fine grain texture
            const moteCount = Math.floor(area / 600);
            paperCtx.fillStyle = 'rgba(120, 105, 85, 0.015)';
            for (let i = 0; i < moteCount; i++) {
                const rx = Math.random() * w;
                const ry = Math.random() * h;
                const radius = Math.random() * 1.5;
                paperCtx.beginPath();
                paperCtx.arc(rx, ry, radius, 0, Math.PI * 2);
                paperCtx.fill();
            }

            // Radial vignette shading
            const grad = paperCtx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.65);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            grad.addColorStop(1, 'rgba(165, 155, 140, 0.15)');
            paperCtx.fillStyle = grad;
            paperCtx.fillRect(0, 0, w, h);

            drawHankoOnPaper();
        }

        function drawHankoOnPaper() {
            const w = paperCanvas.width;
            const h = paperCanvas.height;
            const size = Math.max(45, Math.min(w, h) * 0.065);
            const x = w - size - 40;
            const y = h - size - 40;

            paperCtx.save();
            paperCtx.fillStyle = CONFIG.hankoColor;
            paperCtx.strokeStyle = CONFIG.hankoColor;
            paperCtx.lineWidth = size * 0.025;
            const pad = size * 0.08;
            paperCtx.strokeRect(x + pad, y + pad, size - pad * 2, size - pad * 2);

            paperCtx.font = `bold ${size * 0.52}px "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif`;
            paperCtx.textAlign = 'center';
            paperCtx.textBaseline = 'middle';
            paperCtx.fillText(CONFIG.hankoSymbol, x + size / 2, y + size / 2 + size * 0.035);
            paperCtx.restore();
        }

        // ── PARTICLE SYSTEM (Gravity-aware liquid spray) ─────────
        class InkParticle {
            constructor(x, y, vx, vy, radius, r, g, b) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.r = r;
                this.g = g;
                this.b = b;
                this.alpha = 0.9;
                this.friction = 0.93;
                this.decay = 0.003 + Math.random() * 0.008;
                this.settled = false;
            }

            update() {
                if (this.settled) return;
                
                // Drift slightly in response to device orientation gravity vector!
                this.vx += gravityX * CONFIG.gyroInfluence;
                this.vy += gravityY * CONFIG.gyroInfluence;

                this.x += this.vx;
                this.y += this.vy;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.alpha -= this.decay;

                if (this.alpha <= 0.03 || Math.hypot(this.vx, this.vy) < 0.05) {
                    this.settled = true;
                    // Stain the active water layer
                    drawingCtx.save();
                    drawingCtx.globalAlpha = Math.max(0.02, this.alpha * 0.7);
                    drawingCtx.fillStyle = `rgba(${this.r},${this.g},${this.b},1)`;
                    drawingCtx.beginPath();
                    drawingCtx.arc(this.x, this.y, this.radius * (0.8 + Math.random() * 0.4), 0, Math.PI * 2);
                    drawingCtx.fill();
                    drawingCtx.restore();
                }
            }

            draw(targetCtx) {
                if (this.settled) return;
                targetCtx.fillStyle = `rgba(${this.r},${this.g},${this.b},${this.alpha})`;
                targetCtx.beginPath();
                targetCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                targetCtx.fill();
            }
        }

        function triggerKineticSplatter(px, py, angle, speed) {
            const scaleMod = 0.45;
            const refSize = Math.min(140, speed * 10.0) * scaleMod;
            const dropletCount = Math.floor(Math.min(45, speed * (2 + Math.random() * 2)));
            const { r, g, b } = inkRgb;

            for (let i = 0; i < dropletCount; i++) {
                let u = 0, v = 0;
                while (u === 0) u = Math.random();
                while (v === 0) v = Math.random();
                const gaussNoise = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);

                const satAngle = angle + gaussNoise * 0.25;
                const satVelocity = (speed * 0.4) + (Math.random() * speed * 0.5);
                
                // Inject structural gravity influence on initialization velocity
                const vx = (Math.cos(satAngle) * satVelocity + gravityX * 4) * scaleMod;
                const vy = (Math.sin(satAngle) * satVelocity + gravityY * 4) * scaleMod;
                const sRadius = Math.max(0.4, Math.random() * refSize * 0.08);

                particles.push(new InkParticle(px, py, vx, vy, sRadius, r, g, b));
            }
        }

        // ── HYPER-SMOOTH BRUSH WITH TUNEABLE POOL LIMITS ──────────
        function renderLinkSegment(p1, p2) {
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
            const dt = (p2.t - p1.t) || 1;
            const currentSpd = dist / dt;

            if (p1.spd === undefined) p1.spd = currentSpd;
            p2.spd = currentSpd;

            // This calculates the width and saturation dynamically based on movement speed
            const getSpecs = (spd) => {
                const range = CONFIG.maxBrushWidth - CONFIG.minBrushWidth;
                // Eased inverse speed curve
                const w = CONFIG.minBrushWidth + range / (1.0 + spd * 4.5);
                const opacity = 0.15 + 0.75 / (1.0 + spd * 7.0);
                return { w, opacity };
            };

            // High-precision spacing prevents stamp-overlap "bumpiness"
            const stepDist = 0.8; 
            const steps = Math.max(1, Math.floor(dist / stepDist));

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = p1.x + (p2.x - p1.x) * t;
                const y = p1.y + (p2.y - p1.y) * t;

                const spd = p1.spd + (p2.spd - p1.spd) * t;
                const { w, opacity } = getSpecs(spd);

                drawingCtx.beginPath();
                drawingCtx.arc(x, y, w, 0, Math.PI * 2);
                drawingCtx.fillStyle = inkAt(opacity * 0.28); // Overlapping stamps blend smoothly
                drawingCtx.fill();
            }
        }

        // ── DYNAMIC SURFACE TENSION EVAPORATION ──────────────────
        function applyEvaporation() {
            drawingCtx.save();
            // This composite operation slowly strips alpha away organically
            drawingCtx.globalCompositeOperation = 'destination-out';
            drawingCtx.fillStyle = `rgba(0, 0, 0, ${CONFIG.evaporationSpeed})`;
            drawingCtx.fillRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            drawingCtx.restore();
        }

        // ── COMPOSITING & FLUID DYNAMICS ENGINE ──────────────────
        function processInkBleedAndComposition() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Washi Stone base
            ctx.drawImage(paperCanvas, 0, 0);

            // 2. Compute dynamic fluid bleed layer (simulating porous absorption)
            bleedCtx.clearRect(0, 0, bleedCanvas.width, bleedCanvas.height);
            bleedCtx.save();
            bleedCtx.filter = `blur(${CONFIG.bleedStrength}px)`;
            bleedCtx.globalAlpha = CONFIG.bleedOpacity;
            bleedCtx.drawImage(drawingCanvas, 0, 0);
            bleedCtx.restore();

            // 3. Blend dried + bleeding water together naturally using Multiply
            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(bleedCanvas, 0, 0);
            ctx.drawImage(drawingCanvas, 0, 0);
            ctx.globalCompositeOperation = 'source-over';

            // 4. Update and render airborne particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.settled && p.alpha <= 0.02) {
                    particles.splice(i, 1);
                }
            }

            // 5. Render kinetic ripple ring
            if (ripple) {
                ctx.save();
                ctx.strokeStyle = `rgba(${inkRgb.r},${inkRgb.g},${inkRgb.b},${ripple.opacity})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Kinetic drift of the ripple center in direction of device gravity
                ripple.x += gravityX * 0.4;
                ripple.y += gravityY * 0.4;
                ripple.radius += 2.2;
                ripple.opacity -= 0.015;
                if (ripple.opacity <= 0) ripple = null;
                ctx.restore();
            }

            // 6. Evaporate active water layers for next animation loop frame
            applyEvaporation();
        }

        function step() {
            processInkBleedAndComposition();
            requestAnimationFrame(step);
        }

        // ── GYROSCOPIC TAPE INTEGRATION (Live Gravity Mapping) ────
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta !== null && e.gamma !== null) {
                    // Convert tilt angles (degrees) into physical pixel drift vectors
                    gravityX = Math.min(2.5, Math.max(-2.5, e.gamma / 12));
                    gravityY = Math.min(2.5, Math.max(-2.5, e.beta / 12));
                }
            }, true);
        }

        // ── POINTER HANDLERS ─────────────────────────────────────
        function getPos(e) {
            const src = e.touches ? e.touches[0] : e;
            return { x: src.clientX, y: src.clientY, t: Date.now() };
        }

        function onStart(e) {
            if (e.target !== canvas) return;
            e.preventDefault();

            if (!hintGone) {
                hint.classList.add('gone');
                hintGone = true;
            }
            closeTray();

            snapUndo();
            drawing = true;
            pts = [getPos(e)];
        }

        function onMove(e) {
            if (!drawing) return;
            e.preventDefault();
            const p = getPos(e);
            const last = pts[pts.length - 1];
            const dist = Math.hypot(p.x - last.x, p.y - last.y);
            if (dist < 1.0) return;
            pts.push(p);
            renderLinkSegment(last, p);
        }

        function onEnd(e) {
            if (!drawing) return;
            drawing = false;
            if (pts.length >= 3) maybeFlick();
            pts = [];
        }

        // ── KINETIC FLICK DETECTION ──────────────────────────────
        function maybeFlick() {
            const last = pts[pts.length - 1];
            const prev = pts[Math.max(0, pts.length - 8)];
            const dx = last.x - prev.x;
            const dy = last.y - prev.y;
            const dt = (last.t - prev.t) || 1;
            const spd = Math.hypot(dx, dy) / dt * 15;
            const ang = Math.atan2(dy, dx);

            if (spd > 1.2) {
                triggerKineticSplatter(last.x, last.y, ang, spd);
                ripple = {
                    x: last.x,
                    y: last.y,
                    radius: 1.0,
                    opacity: 0.6,
                };
            }
        }

        // ── TRAY LOGIC ───────────────────────────────────────────
        function openTray() {
            clearTimeout(trayTimer);
            tray.classList.add('visible');
            trayOpen = true;
            trayTimer = setTimeout(closeTray, 4000);
        }

        function closeTray() {
            clearTimeout(trayTimer);
            tray.classList.remove('visible');
            trayOpen = false;
        }

        // Double-tap or double-click to open tray
        let tapCount = 0, tapTimer = null;
        canvas.addEventListener('touchstart', e => {
            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 320);
            if (tapCount >= 2) { 
                tapCount = 0;
                openTray(); 
            }
        }, { passive: true });

        canvas.addEventListener('dblclick', openTray);

        // Swipe up from bottom edge
        let touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener('touchend', e => {
            const dy = touchStartY - e.changedTouches[0].clientY;
            if (dy > 55 && touchStartY > window.innerHeight * 0.75) openTray();
        }, { passive: true });

        tray.addEventListener('pointerenter', () => clearTimeout(trayTimer));
        tray.addEventListener('pointerleave', () => { trayTimer = setTimeout(closeTray, 2000); });

        // ── SWATCH SELECTION ─────────────────────────────────────
        document.querySelectorAll('#tray .swatch').forEach(sw => {
            sw.addEventListener('click', () => {
                setInkColor(sw.dataset.ink);
                document.querySelectorAll('#tray .swatch').forEach(s => s.classList.remove('active'));
                sw.classList.add('active');
                clearTimeout(trayTimer);
                trayTimer = setTimeout(closeTray, 8000);
            });
        });

        // ── BUTTON ACTIONS ───────────────────────────────────────
        document.getElementById('btnUndo').addEventListener('click', () => {
            performUndo();
            clearTimeout(trayTimer);
            trayTimer = setTimeout(closeTray, 8000);
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            snapUndo();
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            bleedCtx.clearRect(0, 0, bleedCanvas.width, bleedCanvas.height);
            particles = [];
            ripple = null;
            generateWashiPaper();
            closeTray();
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = 'living_water_stone_' + Date.now() + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
            clearTimeout(trayTimer);
            trayTimer = setTimeout(closeTray, 8000);
        });

        // ── POINTER EVENTS ───────────────────────────────────────
        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd, { passive: false });

        // ── SIZING & RESIZE ──────────────────────────────────────
        function resize() {
            const tempDrawing = document.createElement('canvas');
            tempDrawing.width = drawingCanvas.width;
            tempDrawing.height = drawingCanvas.height;
            tempDrawing.getContext('2d').drawImage(drawingCanvas, 0, 0);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            setupBuffers();
            generateWashiPaper();
            drawingCtx.drawImage(tempDrawing, 0, 0);
        }

        // ── BOOTSTRAP ────────────────────────────────────────────
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setupBuffers();
            generateWashiPaper();
            requestAnimationFrame(step);
        }

        init();
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
