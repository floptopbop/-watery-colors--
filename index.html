<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>watercolor — force model</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100dvh;
    background:#c8c3b8;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  canvas {
    position:absolute; inset:0; width:100%; height:100%;
    touch-action:none;
  }
  /* ── fold-down tray ── */
  #tray {
    position:fixed; left:0; right:0; bottom:0;
    padding:11px 14px calc(20px + env(safe-area-inset-bottom));
    background:rgba(38,34,30,0.82);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,0.08);
    display:flex; flex-direction:column; gap:9px;
    transform:translateY(100%); opacity:0;
    transition:transform 0.42s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
    z-index:10; touch-action:none;
  }
  #tray.visible { transform:translateY(0); opacity:1; }

  /* grab handle */
  #grab {
    position:absolute; top:5px; left:50%; transform:translateX(-50%);
    width:38px; height:4px; border-radius:2px;
    background:rgba(255,255,255,0.22);
  }

  /* swatch strip — clustered left, over the ink column */
  #swatchRow {
    display:flex; gap:7px; overflow-x:auto; padding:2px 0 1px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  #swatchRow::-webkit-scrollbar { display:none; }
  .swatch {
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:2px solid rgba(255,255,255,0.18);
    transition:transform 0.16s, border-color 0.16s, box-shadow 0.16s;
    touch-action:none;
  }
  .swatch.active {
    border-color:rgba(255,255,255,0.85); transform:scale(1.22);
    box-shadow:0 0 12px rgba(255,255,255,0.18);
  }

  /* divider between colours and brush sizes */
  .rowDiv { width:1px; align-self:stretch; margin:2px 5px; background:rgba(255,255,255,0.14); flex-shrink:0; }

  /* brush-size dots, — inner circle hints the size */
  .size {
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.14);
    transition:transform 0.16s, border-color 0.16s; touch-action:none;
  }
  .size i { display:block; border-radius:50%; background:rgba(255,255,255,0.55); }
  .size.active { border-color:rgba(255,255,255,0.85); transform:scale(1.12); }
  .size.active i { background:rgba(255,255,255,0.92); }

  /* clear/reset — sits at the end of the brush row, warm ring so it reads as an action */
  #resetBtn {
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(216,138,118,0.55);
    background:rgba(120,58,48,0.16); color:rgba(242,204,194,0.9);
    font-size:16px; line-height:1;
    transition:transform 0.16s, border-color 0.16s, background 0.16s;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  #resetBtn:active { transform:scale(0.9); background:rgba(120,58,48,0.34); border-color:rgba(216,138,118,0.85); }

  /* the three columns: ink · napkin · water */
  #dipRow { display:flex; gap:8px; height:70px; }
  .dip, #napkin {
    flex:1; border-radius:7px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', monospace;
    font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .dip .fill {
    position:absolute; left:0; bottom:0; right:0; height:0%;
    background:rgba(255,255,255,0.30); transition:none;
  }
  .dip span, #napkin .napLabel { position:relative; z-index:2; pointer-events:none; }
  #dipInk   { background:#141210; color:#eee; }
  #dipWater { background:#2e5d8a; color:#eaf2fa; }

  /* napkin — three drain zones (ink · both · water) */
  #napkin { background:#e8e4d8; color:#5a5348; }
  .napZones { position:absolute; inset:0; display:flex; z-index:1; }
  .napZone { flex:1; touch-action:none; }
  .napZone.mid { border-left:1px solid rgba(90,83,72,0.18); border-right:1px solid rgba(90,83,72,0.18); }
  .napZone.pressed { background:rgba(90,83,72,0.16); }
  #napkin .napLabel { font-size:0.5rem; opacity:0.6; letter-spacing:0.14em; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="tray">
  <div id="grab"></div>

  <div id="swatchRow">
    <div class="swatch active" style="background:#292420" data-ink="#292420"></div>
    <div class="swatch" style="background:#765649" data-ink="#765649"></div>
    <div class="swatch" style="background:#4E555B" data-ink="#4E555B"></div>
    <div class="swatch" style="background:#586456" data-ink="#586456"></div>
    <div class="swatch" style="background:#714B48" data-ink="#714B48"></div>
    <div class="rowDiv"></div>
    <div class="size" data-r="2"><i style="width:4px;height:4px"></i></div>
    <div class="size active" data-r="8"><i style="width:9px;height:9px"></i></div>
    <div class="size" data-r="16"><i style="width:15px;height:15px"></i></div>
    <div class="size" data-r="32"><i style="width:22px;height:22px"></i></div>
    <div class="rowDiv"></div>
    <div id="resetBtn">↺</div>
  </div>

  <div id="dipRow">
    <div class="dip" id="dipInk"><div class="fill"></div><span>ink</span></div>
    <div id="napkin">
      <div class="napZones">
        <div class="napZone" data-drain="ink"></div>
        <div class="napZone mid" data-drain="both"></div>
        <div class="napZone" data-drain="water"></div>
      </div>
      <span class="napLabel">napkin</span>
    </div>
    <div class="dip" id="dipWater"><div class="fill"></div><span>water</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════════
// MODEL
//   The brush is split into THREE independent things:
//     1. water it lays down   (waterLoad -> adds sat)
//     2. pigment it lays down  (inkLoad  -> adds pig)
//     3. physical agitation    (motion/press -> adds VELOCITY to water)
//   (3) is always on. A bone-dry brush (water=0, ink=0) still shoves any
//   water it's dragged through, so it makes currents and smears live ink
//   instead of going inert. Currents only exist where there's water —
//   dry paper can't be disturbed, which is correct.
//
//   Per wet cell:  sat (live water), pig (live pigment), vx/vy (water velocity).
//   absorbed[]     a persistent per-cell stain, ratcheted one-way into the paper.
//   Three forces on the water each frame:
//     - pressure diffusion (water seeks its own level)  -> blooms, leveling
//     - advection by velocity (the brush push)          -> currents, smearing
//     - evaporation + absorption                        -> drying, staining
//
//   RENDER: the field is drawn to a tiny grid-resolution buffer and then
//   bilinear-upscaled to the screen. That's what kills the pixel-grid look —
//   smooth ramps between cells instead of hard squares — and it's cheaper
//   than the old thousands-of-fillRects approach.
// ═══════════════════════════════════════════════════════════════

const fract = x => x - Math.floor(x);
const dU = (a,b) => fract(Math.sin(a*127.1 + b*311.7) * 43758.5453123);
const dG = (a,b) => (dU(a,b) + dU(a+1.7, b+0.3) + dU(a+3.1, b+2.9) - 1.5) * 1.15; // ~gaussian scatter

// ── grid ──
const CELL = 2;
const EPS  = 0.0001;

// ── pressure diffusion (water leveling) ──
const FLOW           = 0.9929;    // base spread rate (was brush-driven; now a paper constant)
const DIFF_COEF      = 0.2;   // per-edge coefficient — keep <=0.25 for stability
const EDGE_SUB       = 1;      // micro-channels per shared edge (grain anisotropy)
const RELAX_SUBSTEPS = 1;      // conservative sub-iterations per frame
const CRUST_RESIST   = 0.4;

// ── brush as physical force (advection) ──
const FORCE     = .998;   // how hard motion shoves water (per unit brush speed)
const WATER_DRIVE_MIN = 0.9;  // dry brush barely pushes; water in the brush drives the flow
const PRESS_FORCE = 32.0;  // one-shot radial shove when you press down (a bloom)
const HOLD_PRESS  = 34.0;  // radial shove per second while held stationary
const VDAMP     = .04;    // velocity decay /sec  (currents fade in ~0.4s)
const VMAX      = 14;     // max water speed, cells/sec (stability cap)
const VEPS      = 0.001;   // velocities below this snap to 0
const ADV_CFL   = 0.2;   // max fraction of a cell moved per axis per frame (CFL safety)
const MOM_CARRY = 0.8;    // how much a current carries its momentum downstream (0..1)

// ── brush loads: WATER and INK are separate, and drain as you paint ──
let waterLoad = 0.2;     // 0 = bone dry (no water laid), 1 = soaked
let inkLoad   = 1;     // 0 = no pigment,               1 = fully charged
const LOAD_MAX  = 5;    // deposit strength at full load
const DAB       = 0.15;   // overall deposit scale
const INK_FLOOR = .25;    // pigment lays down solid even with a near-dry brush
const DEPLETE   = false;   // <-- set false for the old "infinite load" feel
const WATER_USE = 0.06;   // water drain per unit water laid
const INK_USE   = 0.11;   // ink drains faster -> strokes fade pale, then clear, then just agitate
const RAMP_PER_SEC = 0.6; // dip-bar load/unload speed

// ── absorption / staining (one-way ratchet) ──
const DRY_SECONDS       = 6;
const ABSORB_SAT_THRESH = 0.98;
const ABSORB_RATE       = 0.05;
const MAX_LIVE_CONC     = .95;
const MAX_ABSORBED      = .98;
const BAKE_AFTER_MS     = 6000;

// ── brush geometry ──
let BRUSH_R = 16;   // active brush radius (px) — set by the size picker

// ── splatter (flick the brush to throw droplets — each is a normal deposit) ──
const SPLAT_FLICK_MIN = 0.7;   // px/ms lift-off speed needed to throw anything
const SPLAT_COUNT     = 14;    // droplets per px/ms of flick speed
const SPLAT_CAP       = 34;    // most droplets one flick can throw
const SPLAT_SPREAD    = 0.42;  // angular scatter (radians) around the flick direction
const SPLAT_REACH     = 70;    // px of throw distance per px/ms of flick
const SPLAT_REACH_MAX = 340;   // px cap on how far droplets fly
const SPLAT_DROP_R    = 7;     // biggest droplet radius (px)
const SPLAT_MIN_R     = 1.2;   // smallest droplet radius (px)
const SPLAT_STRENGTH  = 0.5;   // deposit strength per droplet (feeds the same DAB math)
const SPLAT_SMEAR     = 0.6;   // how hard droplets streak along the flick (0 = plops, 1 = long smears)

// ── render ──
const PAPER       = [242, 238, 229];
const K_INK       = 4.2;   // Beer–Lambert pigment darkening (higher = richer blacks)
const WET_SHEEN   = 0.1;  // wet paper reads darker -> lets you SEE clear-water currents
const GRANULATE   = 0.02;  // dried-stain mottling
const PAPER_GRAIN = 0.01;  // faint paper tone variation
let   SOFTEN      = 1.4;   // upscale blur, set from dpr on resize

// ── state ──
let gridW = 0, gridH = 0;
let cells = new Map();
let absorbed = null;                 // Float32Array — persistent stain per cell
let grainTex = null;                 // Float32Array — static paper/granulation texture
let field, fieldCtx, fieldImg;       // tiny grid-res buffer that we upscale
let dpr = 1;

// ── colour (a passenger on the pigment; never affects the physics numbers) ──
// current brush ink, and a per-cell stain colour that rides along with absorbed[]
let inkR = 0x29, inkG = 0x24, inkB = 0x20;      // default = sumi (#292420)
let absColR = null, absColG = null, absColB = null;

function setInk(hex) {
  inkR = parseInt(hex.slice(1,3),16);
  inkG = parseInt(hex.slice(3,5),16);
  inkB = parseInt(hex.slice(5,7),16);
}

// blend a live cell's pigment colour toward (r,g,b) as `amt` new pigment arrives
function blendCellColor(c, r, g, b, amt, prevPig) {
  const next = prevPig + amt;
  if (next <= 1e-9) return;
  const w = amt / next, iw = 1 - w;
  c.ir = c.ir*iw + r*w; c.ig = c.ig*iw + g*w; c.ib = c.ib*iw + b*w;
}

// ratchet `amt` pigment of colour (r,g,b) into the permanent stain at cell i
function addStain(i, r, g, b, amt) {
  if (amt <= 0) return;
  const prev = absorbed[i], next = prev + amt;
  const w = amt / next, iw = 1 - w;
  absColR[i] = absColR[i]*iw + r*w;
  absColG[i] = absColG[i]*iw + g*w;
  absColB[i] = absColB[i]*iw + b*w;
  absorbed[i] = next;
}

function key(cx, cy) { return cx + ',' + cy; }
function idxOf(cx, cy) { return cy * gridW + cx; }
function clampVel(c) {
  const m = Math.hypot(c.vx, c.vy);
  if (m > VMAX) { const s = VMAX / m; c.vx *= s; c.vy *= s; }
}

function getCell(cx, cy, create) {
  if (cx < 0 || cy < 0 || cx >= gridW || cy >= gridH) return null;
  const k = key(cx, cy);
  let c = cells.get(k);
  if (!c && create) {
    c = { sat:0, pig:0, vx:0, vy:0, ir:inkR, ig:inkG, ib:inkB,
          lastActive: performance.now(), born: performance.now(),
          grain:[dU(cx*3.1+1,cy*7.7), dU(cx*3.1+2,cy*7.7), dU(cx*3.1+3,cy*7.7), dU(cx*3.1+4,cy*7.7)] };
    cells.set(k, c);
  }
  return c;
}

let dirtyX0 = Infinity, dirtyY0 = Infinity;
let dirtyX1 = -1,       dirtyY1 = -1;

function markDirty(cx, cy) {
  if (cx < dirtyX0) dirtyX0 = Math.max(0, cx);
  if (cy < dirtyY0) dirtyY0 = Math.max(0, cy);
  if (cx > dirtyX1) dirtyX1 = Math.min(gridW - 1, cx);
  if (cy > dirtyY1) dirtyY1 = Math.min(gridH - 1, cy);
}

function resetDirty() {
  dirtyX0 = gridW; dirtyY0 = gridH;
  dirtyX1 = -1;    dirtyY1 = -1;
}


function setupGrid(cssW, cssH) {
  gridW = Math.max(1, Math.ceil(cssW / CELL));
  gridH = Math.max(1, Math.ceil(cssH / CELL));
  cells.clear();
  absorbed = new Float32Array(gridW * gridH);
  absColR  = new Float32Array(gridW * gridH);
  absColG  = new Float32Array(gridW * gridH);
  absColB  = new Float32Array(gridW * gridH);
  grainTex = new Float32Array(gridW * gridH);
  for (let y = 0; y < gridH; y++)
    for (let x = 0; x < gridW; x++)
      grainTex[y*gridW + x] = dU(x*1.7 + 3.3, y*2.3 + 9.1);
  field = document.createElement('canvas');
  field.width = gridW; field.height = gridH;
  fieldCtx = field.getContext('2d');
  fieldImg = fieldCtx.createImageData(gridW, gridH);
}

// ═══════════════ DEPOSIT (lay water + pigment; drains the loads) ═══════════════
function deposit(px, py, radius, sMul) {
  if (waterLoad <= 0 && inkLoad <= 0) return;   // nothing to lay (force is handled elsewhere)
  const wDab = LOAD_MAX * waterLoad;
  // ink marks on its own — pigment doesn't need water to lay down a solid line
  const iDab = (INK_FLOOR + (LOAD_MAX - INK_FLOOR) * inkLoad);
  const rCells = Math.max(1, Math.ceil(radius / CELL)) + 1;
  const cx0 = Math.floor(px/CELL - rCells), cx1 = Math.ceil(px/CELL + rCells);
  const cy0 = Math.floor(py/CELL - rCells), cy1 = Math.ceil(py/CELL + rCells);
  let usedW = 0, usedI = 0;

  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      if (cx < 0 || cy < 0 || cx >= gridW || cy >= gridH) continue;
      const wcx = (cx + 0.5) * CELL, wcy = (cy + 0.5) * CELL;
      const d = Math.hypot(wcx - px, wcy - py);
      if (d > radius + CELL) continue;
      const f = Math.max(0, 1 - d / (radius + CELL * 0.5));
      if (f <= 0) continue;
      const ff = f * f;
      const addS = wDab * sMul * ff * DAB;
      const addP = iDab * sMul * ff * DAB;
      if (addS < 0.0002 && addP < 0.0002) continue;

      const c = getCell(cx, cy, true);
      const prevPig = c.pig;
      c.sat += addS; c.pig += addP; c.lastActive = performance.now();
      blendCellColor(c, inkR, inkG, inkB, addP, prevPig);   // colour follows the ink
      usedW += addS; usedI += addP;

      // live concentration cap — overflow stains immediately (dry-ish pigment)
      const conc = c.sat > EPS ? c.pig / c.sat : 0;
      if (conc > MAX_LIVE_CONC) {
        const capped = MAX_LIVE_CONC * c.sat, excess = c.pig - capped;
        const i = idxOf(cx, cy), room = Math.max(0, MAX_ABSORBED - absorbed[i]);
        const dump = Math.min(excess, room);
        addStain(i, c.ir, c.ig, c.ib, dump); c.pig = capped + (excess - dump);
      }
    }
  }

function render() {
  if (dirtyX1 < dirtyX0 || dirtyY1 < dirtyY0) return; // Nothing changed

  // Expand bounding box by 1 cell to account for blur/smoothing edges
  const x0 = Math.max(0, dirtyX0 - 1);
  const y0 = Math.max(0, dirtyY0 - 1);
  const x1 = Math.min(gridW - 1, dirtyX1 + 1);
  const y1 = Math.min(gridH - 1, dirtyY1 + 1);

  const data = fieldImg.data;

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * gridW + x;
      // Perform pixel shading only for dirty cells...
    }
  }

  // Only upload the modified sub-rectangle
  const dirtyW = x1 - x0 + 1;
  const dirtyH = y1 - y0 + 1;
  fieldCtx.putImageData(fieldImg, 0, 0, x0, y0, dirtyW, dirtyH);

  // Clear bounding box for next frame
  resetDirty();
}


  if (DEPLETE) {
    waterLoad = Math.max(0, waterLoad - usedW * WATER_USE);
    inkLoad   = Math.max(0, inkLoad   - usedI * INK_USE);
    updateFills();
  }
}

// ═══════════════ FORCE (agitation — pushes existing water only) ═══════════════
function injectForce(px, py, dirx, diry, speedCells, radius) {
  const rCells = Math.max(1, Math.ceil(radius / CELL)) + 1;
  const cx0 = Math.floor(px/CELL - rCells), cx1 = Math.ceil(px/CELL + rCells);
  const cy0 = Math.floor(py/CELL - rCells), cy1 = Math.ceil(py/CELL + rCells);
  const t = performance.now();
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      const c = cells.get(key(cx, cy));
      if (!c) continue;                          // only water can be pushed
      const wcx = (cx + 0.5) * CELL, wcy = (cy + 0.5) * CELL;
      const d = Math.hypot(wcx - px, wcy - py);
      if (d > radius + CELL) continue;
      const f = Math.max(0, 1 - d / (radius + CELL * 0.5));
      if (f <= 0) continue;
      const imp = speedCells * FORCE * f * (WATER_DRIVE_MIN + (1 - WATER_DRIVE_MIN) * waterLoad);
      c.vx += dirx * imp; c.vy += diry * imp;
      c.lastActive = t;
      clampVel(c);
    }
  }
}

// radial shove outward from the press point (a bloom / backrun)
function injectPress(px, py, radius, strength) {
  const rCells = Math.max(1, Math.ceil(radius / CELL)) + 1;
  const cx0 = Math.floor(px/CELL - rCells), cx1 = Math.ceil(px/CELL + rCells);
  const cy0 = Math.floor(py/CELL - rCells), cy1 = Math.ceil(py/CELL + rCells);
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      const c = cells.get(key(cx, cy));
      if (!c) continue;
      const dx = (cx + 0.5) * CELL - px, dy = (cy + 0.5) * CELL - py;
      const d = Math.hypot(dx, dy);
      if (d > radius + CELL) continue;
      const f = Math.max(0, 1 - d / (radius + CELL * 0.5));
      if (f <= 0) continue;
      const inv = d > 0.001 ? 1 / d : 0;
      const imp = strength * f;
      c.vx += dx * inv * imp; c.vy += dy * inv * imp;
      clampVel(c);
    }
  }
}

// ═══════════════ PRESSURE DIFFUSION (single-pass, conservative) ═══════════════
// Each shared edge is processed exactly once: +x/+y directions always, and
// -x/-y only into cells that don't exist yet. No double-count, no leak.
function diffuse(dtSec) {
  const deltas = new Map();
  const col = new Map();   // per receiving cell: pigment-weighted incoming colour
  const add = (k, ds, dp) => { let d = deltas.get(k); if (!d) { d = { ds:0, dp:0 }; deltas.set(k, d); } d.ds += ds; d.dp += dp; };
  const addCol = (k, r, g, b, wp) => { if (wp <= 0) return; let d = col.get(k); if (!d) { d = { r:0, g:0, b:0, w:0 }; col.set(k, d); } d.r += r*wp; d.g += g*wp; d.b += b*wp; d.w += wp; };
  const dtFactor = Math.min(1, dtSec * 60);

  for (const [k, c] of cells) {
    if (c.sat < EPS && c.pig < EPS) continue;
    const ci = k.indexOf(','); const cx = +k.slice(0, ci), cy = +k.slice(ci + 1);
    const nb = [[cx+1,cy,0],[cx-1,cy,1],[cx,cy+1,2],[cx,cy-1,3]];

    for (const [nx, ny, dir] of nb) {
      if (nx < 0 || ny < 0 || nx >= gridW || ny >= gridH) continue;
      const canonical = (dir === 0 || dir === 2);
      const nk = key(nx, ny);
      const nCell = cells.get(nk);
      if (nCell && !canonical) continue;         // handled from the other cell

      const nSat = nCell ? nCell.sat : 0, nPig = nCell ? nCell.pig : 0;
      const diff = c.sat - nSat;
      if (Math.abs(diff) < 0.02) continue;

      const srcConc = c.sat > EPS ? c.pig / Math.max(c.sat, EPS) : (c.pig > EPS ? 999 : 0);
      const crusted = c.sat < 0.06 && srcConc > 1.4;
      if (crusted && Math.abs(diff) < CRUST_RESIST) continue;

      let grain = 0.05;
      for (let s = 0; s < EDGE_SUB; s++) grain += 0.6 + 0.5 * c.grain[(dir + s) % 4];
      grain /= EDGE_SUB;

      const move = diff * FLOW * DIFF_COEF * grain * dtFactor;
      if (move === 0) continue;

      if (move > 0) {
        const conc = c.sat > EPS ? c.pig / c.sat : 0;
        add(k, -move, -move*conc); add(nk, move, move*conc);
        addCol(nk, c.ir, c.ig, c.ib, move*conc);                 // nk gains k's colour
      } else {
        const conc = nSat > EPS ? nPig / nSat : 0;
        add(k, -move, -move*conc); add(nk, move, move*conc);
        if (nCell) addCol(k, nCell.ir, nCell.ig, nCell.ib, -move*conc);  // k gains nk's colour
      }
    }
  }

  for (const [k, d] of deltas) {
    let c = cells.get(k);
    if (!c) { if (d.ds <= 0 && d.dp <= 0) continue; const ci = k.indexOf(','); c = getCell(+k.slice(0, ci), +k.slice(ci + 1), true); }
    c.sat = Math.max(0, c.sat + d.ds); c.pig = Math.max(0, c.pig + d.dp);
  }
  for (const [k, d] of col) {
    const c = cells.get(k);
    if (!c || d.w <= 0) continue;
    const a = Math.min(0.5, d.w / (c.pig + EPS));
    const ir = d.r/d.w, ig = d.g/d.w, ib = d.b/d.w;
    c.ir = c.ir*(1-a) + ir*a; c.ig = c.ig*(1-a) + ig*a; c.ib = c.ib*(1-a) + ib*a;
  }
}

// ═══════════════ ADVECTION (velocity carries water + pigment) ═══════════════
function advect(dtSec) {
  const dS = new Map();      // sat/pig deltas
  const carry = new Map();   // momentum handed to receiving cells
  const col = new Map();     // pigment-weighted incoming colour
  const add  = (k, ds, dp) => { let d = dS.get(k); if (!d) { d = { ds:0, dp:0 }; dS.set(k, d); } d.ds += ds; d.dp += dp; };
  const addC = (k, vx, vy, w) => { let d = carry.get(k); if (!d) { d = { vx:0, vy:0, w:0 }; carry.set(k, d); } d.vx += vx*w; d.vy += vy*w; d.w += w; };
  const addCol = (k, r, g, b, wp) => { if (wp <= 0) return; let d = col.get(k); if (!d) { d = { r:0, g:0, b:0, w:0 }; col.set(k, d); } d.r += r*wp; d.g += g*wp; d.b += b*wp; d.w += wp; };

  for (const [k, c] of cells) {
    if (c.sat < EPS) continue;
    if (c.vx === 0 && c.vy === 0) continue;
    const ci = k.indexOf(','); const cx = +k.slice(0, ci), cy = +k.slice(ci + 1);
    const conc = c.pig / c.sat;

    let fx = c.vx * dtSec;
    if (fx > ADV_CFL) fx = ADV_CFL; else if (fx < -ADV_CFL) fx = -ADV_CFL;
    if (fx > 1e-4 || fx < -1e-4) {
      const nx = cx + (fx > 0 ? 1 : -1);
      if (nx >= 0 && nx < gridW) {
        const sMove = c.sat * Math.abs(fx), pMove = sMove * conc, nk = key(nx, cy);
        add(k, -sMove, -pMove); add(nk, sMove, pMove);
        addC(nk, c.vx, c.vy, sMove * MOM_CARRY);
        addCol(nk, c.ir, c.ig, c.ib, pMove);
      }
    }

    let fy = c.vy * dtSec;
    if (fy > ADV_CFL) fy = ADV_CFL; else if (fy < -ADV_CFL) fy = -ADV_CFL;
    if (fy > 1e-4 || fy < -1e-4) {
      const ny = cy + (fy > 0 ? 1 : -1);
      if (ny >= 0 && ny < gridH) {
        const sMove = c.sat * Math.abs(fy), pMove = sMove * conc, nk = key(cx, ny);
        add(k, -sMove, -pMove); add(nk, sMove, pMove);
        addC(nk, c.vx, c.vy, sMove * MOM_CARRY);
        addCol(nk, c.ir, c.ig, c.ib, pMove);
      }
    }
  }

  for (const [k, d] of dS) {
    let c = cells.get(k);
    if (!c) { if (d.ds <= 0 && d.dp <= 0) continue; const ci = k.indexOf(','); c = getCell(+k.slice(0, ci), +k.slice(ci + 1), true); }
    c.sat = Math.max(0, c.sat + d.ds); c.pig = Math.max(0, c.pig + d.dp);
  }
  for (const [k, d] of col) {
    const c = cells.get(k);
    if (!c || d.w <= 0) continue;
    const a = Math.min(0.5, d.w / (c.pig + EPS));
    const ir = d.r/d.w, ig = d.g/d.w, ib = d.b/d.w;
    c.ir = c.ir*(1-a) + ir*a; c.ig = c.ig*(1-a) + ig*a; c.ib = c.ib*(1-a) + ib*a;
  }
  for (const [k, d] of carry) {
    const c = cells.get(k);
    if (!c || d.w <= 0) continue;
    const inVx = d.vx / d.w, inVy = d.vy / d.w;
    const a = Math.min(0.6, d.w / (c.sat + EPS));   // stronger blend where more flow arrived
    c.vx = c.vx * (1 - a) + inVx * a;
    c.vy = c.vy * (1 - a) + inVy * a;
    clampVel(c);
  }
}

function decayVel(dtSec) {
  const damp = Math.exp(-VDAMP * dtSec);
  for (const [, c] of cells) {
    c.vx *= damp; c.vy *= damp;
    if (c.vx < VEPS && c.vx > -VEPS) c.vx = 0;
    if (c.vy < VEPS && c.vy > -VEPS) c.vy = 0;
  }
}

// ═══════════════ EVAPORATION + ABSORPTION ═══════════════
function evaporate(dtSec) {
  const rate = dtSec / DRY_SECONDS;
  for (const [k, c] of cells) {
    if (c.sat > 0) c.sat = Math.max(0, c.sat - rate);
    if (c.sat < ABSORB_SAT_THRESH && c.pig > EPS) {
      const ci = k.indexOf(','); const cx = +k.slice(0, ci), cy = +k.slice(ci + 1);
      const i = idxOf(cx, cy);
      if (absorbed[i] < MAX_ABSORBED) {
        const dryness = 1 - Math.min(1, c.sat / ABSORB_SAT_THRESH);
        let take = c.pig * Math.min(1, ABSORB_RATE * dryness * dtSec);
        take = Math.min(take, MAX_ABSORBED - absorbed[i]);
        if (take > 0) { c.pig -= take; addStain(i, c.ir, c.ig, c.ib, take); }
      }
    }
  }
}

function reapIdle(nowT) {
  for (const [k, c] of cells) {
    if (c.sat < EPS) {
      if (nowT - c.lastActive > BAKE_AFTER_MS) {
        if (c.pig > 0.001) {
          const ci = k.indexOf(','); const cx = +k.slice(0, ci), cy = +k.slice(ci + 1);
          const i = idxOf(cx, cy), room = Math.max(0, MAX_ABSORBED - absorbed[i]);
          addStain(i, c.ir, c.ig, c.ib, Math.min(c.pig, room));
        }
        cells.delete(k);
      }
    } else {
      c.lastActive = nowT;
    }
  }
}

// ═══════════════ RENDER (grid buffer -> bilinear upscale) ═══════════════
function render() {
  const data = fieldImg.data;
  const N = gridW * gridH;

  // base pass: paper + dried stain (ink colour composited over paper)
  for (let i = 0; i < N; i++) {
    const g = grainTex[i];
    const T = absorbed[i] * (1 - GRANULATE * 0.5 + GRANULATE * g);
    const a = 1 - Math.exp(-K_INK * T);
    const pm = 1 - PAPER_GRAIN * (g - 0.5) * 2;
    const om = (1 - a) * pm;                       // paper showing through
    const o = i * 4;
    data[o]   = PAPER[0]*om + absColR[i]*a;
    data[o+1] = PAPER[1]*om + absColG[i]*a;
    data[o+2] = PAPER[2]*om + absColB[i]*a;
    data[o+3] = 255;
  }

  // overlay pass: live wet cells (wet pigment over stain + wet sheen)
  for (const [k, c] of cells) {
    if (c.sat < EPS && c.pig < EPS) continue;
    const ci = k.indexOf(','); const cx = +k.slice(0, ci), cy = +k.slice(ci + 1);
    const i = idxOf(cx, cy), g = grainTex[i];
    const stainT = absorbed[i] * (1 - GRANULATE * 0.5 + GRANULATE * g);
    const liveP  = c.pig;
    const T = stainT + liveP;
    const a = 1 - Math.exp(-K_INK * T);
    // ink colour = stain + live pigment, weighted by their contribution
    const wsum = stainT + liveP;
    let cr, cg, cb;
    if (wsum > EPS) {
      cr = (absColR[i]*stainT + c.ir*liveP) / wsum;
      cg = (absColG[i]*stainT + c.ig*liveP) / wsum;
      cb = (absColB[i]*stainT + c.ib*liveP) / wsum;
    } else { cr = c.ir; cg = c.ig; cb = c.ib; }
    let pv = 1 - PAPER_GRAIN * (g - 0.5) * 2;
    pv *= (1 - WET_SHEEN * Math.min(1, c.sat));
    const om = (1 - a) * pv;
    const o = i * 4;
    data[o]   = PAPER[0]*om + cr*a;
    data[o+1] = PAPER[1]*om + cg*a;
    data[o+2] = PAPER[2]*om + cb*a;
  }

  fieldCtx.putImageData(fieldImg, 0, 0);
  ctx.save();
  ctx.filter = SOFTEN > 0 ? `blur(${SOFTEN}px)` : 'none';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(field, 0, 0, gridW, gridH, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// ═══════════════ LOOP ═══════════════
let lastT = performance.now();
function frame(nowT) {
  const dtSec = Math.min(0.05, (nowT - lastT) / 1000);
  lastT = nowT;

  tickHold(nowT);
  holdFeed(nowT);
  for (let i = 0; i < RELAX_SUBSTEPS; i++) diffuse(dtSec);
  advect(dtSec);
  decayVel(dtSec);
  evaporate(dtSec);
  reapIdle(nowT);
  render();

  requestAnimationFrame(frame);
}

// ═══════════════ SPLATTER — flick to throw droplets ═══════════════
// a flick throws a fan of droplets in the direction of motion. each droplet is
// just a deposit() at its landing spot, so it blooms, bleeds, stains and dries
// under the exact same rules as the brush — no separate particles, no separate
// render. farther droplets land fainter, the way real spatter does.
function spawnSplat(px, py, angle, spd) {
  if (spd < SPLAT_FLICK_MIN) return;
  if (waterLoad <= 0 && inkLoad <= 0) return;        // same load rule as the brush
  const seed = Math.floor(px)*3.1 + Math.floor(py)*7.7 + Math.floor(angle*57.3)*13.9;
  const cnt = Math.floor(Math.min(SPLAT_CAP, spd * SPLAT_COUNT));
  if (cnt < 3) return;
  const reach = Math.min(SPLAT_REACH_MAX, spd * SPLAT_REACH);
  const fdx = Math.cos(angle), fdy = Math.sin(angle);                // the flick's own direction
  const smear = Math.min(VMAX, spd * 1000 / CELL) * SPLAT_SMEAR;     // inherited momentum (cells/sec)
  for (let i = 0; i < cnt; i++) {
    const a    = angle + dG(seed, i * 2.39996) * SPLAT_SPREAD;      // scattered around the flick
    const dist = reach * (0.12 + dU(seed + 1.3, i) * 0.88);         // near .. far
    const rad  = Math.max(SPLAT_MIN_R, (0.3 + dU(seed + 2.6, i) * 0.7) * SPLAT_DROP_R);
    const fall = 1 - 0.55 * dist / (reach + 1e-3);                  // farther = fainter / slower
    const lx = px + Math.cos(a) * dist, ly = py + Math.sin(a) * dist; // where it lands
    deposit(lx, ly, rad, SPLAT_STRENGTH * fall);
    injectForce(lx, ly, fdx, fdy, smear * fall, rad * 1.8);         // drag the fresh drop along the flick → streaks when fast
  }
}

// ═══════════════ INPUT — touch only ═══════════════
let drawing = false, curPt = null, prevPt = null, lastMoveT = 0;
let flickVX = 0, flickVY = 0, flickT = 0;   // lift-off velocity, for the splatter flick
const STATIONARY_MS = 60;
const HOLD_FEED_RATE = 3.0;

function tp(e) { const t = e.touches[0] || e.changedTouches[0]; return { x: t.clientX, y: t.clientY }; }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  drawing = true;
  const p = tp(e), t = performance.now();
  curPt = { x: p.x, y: p.y }; prevPt = { x: p.x, y: p.y, t };
  lastMoveT = t; holdFeed._last = t;
  flickVX = 0; flickVY = 0; flickT = 0;
  deposit(p.x, p.y, BRUSH_R, 1.0);
  injectPress(p.x, p.y, BRUSH_R, PRESS_FORCE);  // always agitate on touch, even dry
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drawing) return;
  const p = tp(e), t = performance.now();
  const dt = Math.max(4, t - prevPt.t);
  const dx = p.x - prevPt.x, dy = p.y - prevPt.y;
  const dist = Math.hypot(dx, dy);
  const spd = dist / dt;                                  // px/ms
  const w = Math.max(BRUSH_R * 0.5, BRUSH_R / (1 + spd * 3.5)); // fast stroke = thinner (scales with size)
  const sMul = Math.min(1.4, Math.max(0.3, 1 / (1 + spd * 4)));
  const steps = Math.max(1, Math.floor(dist / 4));
  const dirx = dist > 0.001 ? dx / dist : 0, diry = dist > 0.001 ? dy / dist : 0;
  const speedCells = Math.min(VMAX, spd * 1000 / CELL);   // px/ms -> cells/sec

  for (let i = 1; i <= steps; i++) {
    const tt = i / steps;
    const x = prevPt.x + dx * tt, y = prevPt.y + dy * tt;
    injectForce(x, y, dirx, diry, speedCells, w);   // shove existing water — always, even dry brush
    if (waterLoad > 0 || inkLoad > 0) deposit(x, y, w, sMul);  // only lay paint if we have load
  }
  flickVX = dx / dt; flickVY = dy / dt; flickT = t;   // remember lift-off velocity
  curPt = { x: p.x, y: p.y }; prevPt = { x: p.x, y: p.y, t }; lastMoveT = t;
}, { passive:false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  // flick to splatter: only if the finger was still moving fast right at lift-off
  if (drawing && performance.now() - flickT < 90) {
    const spd = Math.hypot(flickVX, flickVY);
    if (spd > SPLAT_FLICK_MIN) {
      const lp = tp(e);
      spawnSplat(lp.x, lp.y, Math.atan2(flickVY, flickVX), spd);
    }
  }
  drawing = false; curPt = null; prevPt = null;
}, { passive:false });
canvas.addEventListener('touchcancel', () => { drawing = false; curPt = null; prevPt = null; });

// held-still brush keeps feeding + blooming (a loaded brush bleeds; a dry one just agitates)
function holdFeed(nowT) {
  if (!drawing || !curPt) return;
  if (nowT - lastMoveT < STATIONARY_MS) return;
  const dt = Math.min(0.05, (nowT - (holdFeed._last || nowT)) / 1000);
  holdFeed._last = nowT;
  deposit(curPt.x, curPt.y, BRUSH_R, dt * HOLD_FEED_RATE);
  injectPress(curPt.x, curPt.y, BRUSH_R * 1.2, HOLD_PRESS * dt);
}

// ═══════════ DIP STATION · NAPKIN · SWATCHES · FOLD-DOWN TRAY ═══════════
// ink  -> charge pigment     water -> charge water
// napkin: left drains ink · middle drains both · right drains water
const tray      = document.getElementById('tray');
const dipWater  = document.getElementById('dipWater');
const dipInk    = document.getElementById('dipInk');
const fillWater = dipWater.querySelector('.fill');
const fillInk   = dipInk.querySelector('.fill');

function updateFills() {
  fillWater.style.height = (Math.min(1, waterLoad) * 100).toFixed(0) + '%';
  fillInk.style.height   = (Math.min(1, inkLoad)   * 100).toFixed(0) + '%';
}
updateFills();

// ---- charge / drain ----
let holding = null;   // 'ink' | 'water' | 'napInk' | 'napWater' | 'napBoth'
function tickHold(nowT) {
  if (!holding) return;
  const dt = Math.min(0.1, (nowT - (tickHold._last || nowT)) / 1000);
  tickHold._last = nowT;
  const step = RAMP_PER_SEC * dt;
  switch (holding) {
    case 'ink':      inkLoad   = Math.min(1, inkLoad   + step); break;
    case 'water':    waterLoad = Math.min(1, waterLoad + step); break;
    case 'napInk':   inkLoad   = Math.max(0, inkLoad   - step); break;
    case 'napWater': waterLoad = Math.max(0, waterLoad - step); break;
    case 'napBoth':  inkLoad = Math.max(0, inkLoad - step); waterLoad = Math.max(0, waterLoad - step); break;
  }
  updateFills();
}
function startHold(which) { tickHold._last = performance.now(); holding = which; keepTrayOpen(); }
function stopHold() { holding = null; scheduleClose(); }

function bindDip(el, which) {
  el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); startHold(which); }, { passive:false });
  el.addEventListener('touchend',   e => { e.preventDefault(); stopHold(); }, { passive:false });
  el.addEventListener('touchcancel', () => stopHold());
}
bindDip(dipInk, 'ink');
bindDip(dipWater, 'water');

// napkin — three drain zones
document.querySelectorAll('#napkin .napZone').forEach(z => {
  const d = z.dataset.drain;
  const which = d === 'ink' ? 'napInk' : d === 'water' ? 'napWater' : 'napBoth';
  z.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); z.classList.add('pressed'); startHold(which); }, { passive:false });
  z.addEventListener('touchend',   e => { e.preventDefault(); z.classList.remove('pressed'); stopHold(); }, { passive:false });
  z.addEventListener('touchcancel', () => { z.classList.remove('pressed'); stopHold(); });
});

// swatches — pick the ink colour (old strokes keep their own colour)
document.querySelectorAll('#swatchRow .swatch').forEach(sw => {
  const pick = e => {
    e.preventDefault(); e.stopPropagation();
    setInk(sw.dataset.ink);
    document.querySelectorAll('#swatchRow .swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    keepTrayOpen(); scheduleClose();
  };
  sw.addEventListener('touchstart', pick, { passive:false });
  sw.addEventListener('click', pick);
});

// brush sizes — swap the active brush radius
document.querySelectorAll('#swatchRow .size').forEach(sz => {
  const pick = e => {
    e.preventDefault(); e.stopPropagation();
    BRUSH_R = +sz.dataset.r;
    document.querySelectorAll('#swatchRow .size').forEach(s => s.classList.remove('active'));
    sz.classList.add('active');
    keepTrayOpen(); scheduleClose();
  };
  sz.addEventListener('touchstart', pick, { passive:false });
  sz.addEventListener('click', pick);
});

// ---- fold-down reveal ----
let trayTimer = null;
function keepTrayOpen() { clearTimeout(trayTimer); }
function scheduleClose(ms) { clearTimeout(trayTimer); trayTimer = setTimeout(closeTray, ms || 3500); }
function openTray()  { tray.classList.add('visible'); scheduleClose(4500); }
function closeTray() { clearTimeout(trayTimer); tray.classList.remove('visible'); holding = null; }

tray.addEventListener('touchstart', () => keepTrayOpen(), { passive:true });
tray.addEventListener('touchend',   () => scheduleClose(), { passive:true });
document.getElementById('grab').addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); closeTray(); }, { passive:false });

// double-tap anywhere, or swipe up from the very bottom edge, to reveal
let tapCount = 0, tapTimer = null;
canvas.addEventListener('touchstart', () => {
  tapCount++; clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 300);
  if (tapCount >= 2) { tapCount = 0; openTray(); }
}, { passive:true });

let swipeY = 0;
canvas.addEventListener('touchstart', e => { swipeY = e.touches[0].clientY; }, { passive:true });
canvas.addEventListener('touchend', e => {
  const dy = swipeY - e.changedTouches[0].clientY;
  if (dy > 45 && swipeY > window.innerHeight * 0.9) openTray();
}, { passive:true });

// ═══════════════ RESET (now actually wired up) ═══════════════
const resetBtn = document.getElementById('resetBtn');
function resetAll() { cells.clear(); if (absorbed) { absorbed.fill(0); absColR.fill(0); absColG.fill(0); absColB.fill(0); } waterLoad = 0.05; inkLoad = 4; updateFills(); }
resetBtn.addEventListener('touchend', e => { e.preventDefault(); resetAll(); }, { passive:false });
resetBtn.addEventListener('click', () => resetAll());

// ═══════════════ BOOTSTRAP ═══════════════
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cssW = window.innerWidth, cssH = window.innerHeight;
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  SOFTEN = Math.max(0.6, dpr * CELL * 0.12);
  setupGrid(cssW, cssH);
}
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);

// show the tray once on load so it's discoverable, then let it fold down
setTimeout(openTray, 400);
</script>
</body>
