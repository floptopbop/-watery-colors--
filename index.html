<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sumi-e — water on stone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100dvh;
            background: #c8c3b8;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        /* ── tap-to-reveal tray ── */
        #tray {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 20px 28px;
            background: rgba(38, 34, 30, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            transform: translateY(100%);
            opacity: 0;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        #tray.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* ink swatches */
        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.16);
            flex-shrink: 0;
            transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
            position: relative;
        }
        .swatch:hover {
            transform: scale(1.15);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .swatch.active {
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.25);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
        }

        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.13);
            flex-shrink: 0;
        }

        /* ghost text buttons */
        .ghost-btn {
            font-family: 'Courier New', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.5);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            transition: color 0.18s;
            white-space: nowrap;
        }
        .ghost-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        /* mode toggle — reads as a switch, not another action */
        #btnMode {
            font-family: 'Courier New', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.82);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 3px;
            cursor: pointer;
            padding: 6px 10px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.18s, border-color 0.18s;
        }
        #btnMode:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.45);
        }

        .sp {
            flex: 1;
        }

        /* hint text */
        #hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            color: rgba(70, 60, 50, 0.25);
            pointer-events: none;
            transition: opacity 1.8s ease;
            text-align: center;
            line-height: 2.4;
            z-index: 5;
        }
        #hint.gone {
            opacity: 0;
        }
        #hint span {
            font-size: 0.55rem;
            letter-spacing: 0.28em;
            color: rgba(70, 60, 50, 0.15);
        }

        /* mode flash — tells you which engine you just landed in */
        #modeFlash {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(70, 60, 50, 0.42);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 6;
            text-align: center;
            line-height: 2;
        }
        #modeFlash.show { opacity: 1; }
        #modeFlash span {
            display: block;
            font-size: 0.5rem;
            letter-spacing: 0.22em;
            color: rgba(70, 60, 50, 0.22);
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div id="hint">
        water on stone<br>
        <span>trace the moment — it fades</span>
    </div>

    <div id="modeFlash"></div>

    <div id="tray">
        <div class="swatch active" style="background:#2a2420" data-ink="#2a2420" title="sumi"></div>
        <div class="swatch" style="background:#3d1f14" data-ink="#3d1f14" title="sepia"></div>
        <div class="swatch" style="background:#141c24" data-ink="#141c24" title="indigo"></div>
        <div class="swatch" style="background:#14281D" data-ink="#14281D" title="charcoal"></div>
        <div class="swatch" style="background:#4a1a1a" data-ink="#4a1a1a" title="cinnabar"></div>

        <div class="divider"></div>

        <button id="btnMode">board</button>

        <div class="divider"></div>

        <button class="ghost-btn" id="btnUndo">undo</button>
        <button class="ghost-btn" id="btnClear">clear</button>

        <div class="sp"></div>

        <button class="ghost-btn" id="btnSave">save</button>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');
        const tray = document.getElementById('tray');
        const modeFlash = document.getElementById('modeFlash');

        // ═══════════════════════════════════════════════════════════
        // TWO ENGINES, ONE SHELL
        //
        // They are genuinely different machines, not one machine with a
        // slider — so they stay separate where they differ and share
        // everything where they don't.
        //
        //   PAINT  — watercolor. One persistent ink layer. Speed-driven
        //            round stamps that pool where you pause. Permanent by
        //            default (evaporationSpeed 0). Undo = pixel snapshots.
        //
        //   BOARD  — buddha board. Every mark is its own timed layer whose
        //            alpha comes from its age, so it reaches exactly zero
        //            at lifespan. Continuous ribbon geometry, pressure and
        //            contact aware. Undo = lift the whole last mark.
        //
        // Shared: paper, ink, splatter, bleed, tray, pointer plumbing.
        // ═══════════════════════════════════════════════════════════
        let MODE = 'board';   // 'board' | 'paint'

        // ── PAINT ENGINE TUNABLES (from brush.html, verbatim) ──────
        const PAINT = {
            // How fast the water completely dries up (Lower = lasts longer)
            // Try 0.0015 for a super slow, meditative fade!
            // Set to 0 for permanent watercolor — nothing ever fades.
            evaporationSpeed: 0.0042,

            // Controls the physical "pooling" limits when your finger pauses.
            // minBrushWidth: Minimum thickness when moving lightning fast
            // maxBrushWidth: Maximum thickness when perfectly stationary
            minBrushWidth: .01,
            maxBrushWidth: 15.0,

            // Stroke smoothness — cure for lumpy strokes at speed.
            // Lower = silkier width changes, laggier response (try 0.05–0.5)
            speedSmooth: 0.5,

            // Wet-ink bleeding settings
            bleedStrength: 0.00001,   // How far water creeps outward into the stone fibers
            bleedOpacity: 0.6,   // Softness of the bleeding edge halo

            paper: '#f2eee5',
            hankoColor: 'rgba(160, 24, 24, 0.45)',
            hankoSymbol: '像',
        };

        // ── BOARD ENGINE TUNABLES (from paint_v2, verbatim) ────────
        const CFG = {
            // ── evaporation ──
            lifespan: 50000,      // ms — real board: water lasts about a minute
            holdFrac: 0.33,       // fraction of life a mark stays fully wet before easing out
            autoSplitMs: 200000,    // long strokes commit in segments so their tails dry first

            // ── ribbon brush ──
            wMax: 25, wMin: .5,  // full-press vs feather-touch width
            nibAspect: 1,       // flat-brush cross-section (1 = round tip)
            nibAngle: 0,     // resting chisel orientation, radians (-45°)
            nibFollow: 0,         // 0 = fixed chisel, 0 = bristles trail the motion
            nibLag: 0,         // smoothing when the nib target changes
            pressGamma: 1,      // pressure → width curve
            inkGamma: 0.25,       // pressure → water-load curve
            oMax: 0.98, oMin: 0.15,
            alphaSmooth: 0.08,    // how fast a stroke's water load follows pressure
            contactRef: 36,       // touch-patch px that reads as "normal" finger
            contactMin: 0.1, contactMax: 2.5,
            fallbackSpeedK: 22,  // no force hardware: slow = heavy press
            touchSmooth: 0.5,    // low-pass on pressure/contact
            speedSmooth: 0.1,     // low-pass on velocity
            wobble: 0,         // harmonic breathing of stroke width
            dryStart: 1,        // px/ms where dry-brush break-up begins
            dryRag: .4,          // edge raggedness when dry (0..1)
            dryBreak: 0.65,        // gap threshold — lower = more breaks along a dry stroke
            tapMs: 120,           // touches shorter than this leave no mark (tray taps)

            // ── splatter ──
            flickSpeed: 4,      // px/ms at lift-off that throws ink
            splatCount: 45,       // droplets per px/ms of flick speed
            splatSize: 0.075,     // droplet radius scale
            splatReach: 3,      // launch velocity per px/ms of flick
            shedSpeed: 1,       // px/ms mid-stroke that sheds droplets off the bristles
            shedEveryMs: 90,
            crownV: 4.2,          // launch speed (px/frame) that earns a micro-splash on landing
            maxParticles: 1520,

            // ── wet bleed halo ──
            bleedPx: 3.2,
            bleedAlpha: 0.005,

            paper: '#f4f1ea',
            hankoColor: 'rgba(160, 24, 24, 0.55)',
            hankoSymbol: '像',
        };

        const modeCfg = () => (MODE === 'paint' ? PAINT : CFG);

        // ═══════════════ DETERMINISM — no Math.random anywhere ═══════════════
        const R2A = 0.7548776662466927, R2B = 0.5698402909980532;
        const GOLD = Math.PI * (3 - Math.sqrt(5));
        const fract = x => x - Math.floor(x);
        const dU = (a, b) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453123);
        const dS = (a, b) => dU(a, b) * 2 - 1;
        const dG = (a, b) => (dU(a, b) + dU(a + 1.618, b + 3.14) + dU(a + 2.71, b + 1.41) - 1.5) * 1.15;

        // ═══════════════ BUFFERS ═══════════════
        const paperCanvas = document.createElement('canvas');
        const paperCtx = paperCanvas.getContext('2d');
        const compCanvas = document.createElement('canvas');
        const compCtx = compCanvas.getContext('2d');
        const bleedCanvas = document.createElement('canvas');
        const bleedCtx = bleedCanvas.getContext('2d');
        const activeCanvas = document.createElement('canvas');   // board: live stroke
        const activeCtx = activeCanvas.getContext('2d');
        const inkCanvas = document.createElement('canvas');       // paint: persistent layer
        const inkCtx = inkCanvas.getContext('2d');

        function setupBuffers() {
            [paperCanvas, compCanvas, bleedCanvas, activeCanvas, inkCanvas].forEach(c => {
                c.width = canvas.width;
                c.height = canvas.height;
            });
        }

        // ═══════════════ SHARED STATE ═══════════════
        let inkHex = '#2a2420';
        let inkRgb = { r: 42, g: 36, b: 32 };
        let particles = [];
        let ripple = null;
        let drawing = false;
        let hasPressure = false;
        let hintGone = false;
        let trayOpen = false;
        let trayTimer = null;
        let flashTimer = null;

        // board state
        let strokes = [];
        let live = null;
        let liveDirty = false;
        let groupSeq = 0;

        // paint state
        let pts = [];
        let smSpd = 0;
        let undoStack = [];

        // ═══════════════ INK HELPERS ═══════════════
        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16),
            };
        }
        function setInkColor(hex) { inkHex = hex; inkRgb = hexToRgb(hex); }
        function inkAt(a) { return `rgba(${inkRgb.r},${inkRgb.g},${inkRgb.b},${Math.min(1, a)})`; }

        // ═══════════════ EVAPORATION (board) ═══════════════
        // Alpha comes from age, so at lifespan it is exactly 0. The old
        // destination-out fade was multiplicative on 8-bit alpha: low values
        // round back to themselves and stall forever — residue that never left.
        function fadeAlpha(age) {
            const t = age / CFG.lifespan;
            if (t <= CFG.holdFrac) return 1;
            if (t >= 1) return 0;
            const u = (t - CFG.holdFrac) / (1 - CFG.holdFrac);
            return 0.5 + 0.5 * Math.cos(Math.PI * u);
        }

        // ═══════════════ WASHI PAPER (deterministic, per-mode) ═══════════════
        function generateWashiPaper() {
            const w = paperCanvas.width;
            const h = paperCanvas.height;
            const M = modeCfg();
            const paint = (MODE === 'paint');

            paperCtx.clearRect(0, 0, w, h);
            paperCtx.fillStyle = M.paper;
            paperCtx.fillRect(0, 0, w, h);

            const area = w * h;

            // fibres — R2 low-discrepancy scatter, golden-angle orientation.
            // paint uses short straight hairs, board uses long bezier threads:
            // each engine keeps the exact paper it was tuned against.
            const fiberCount = Math.floor(area / (paint ? 3000 : 3800));
            paperCtx.strokeStyle = paint ? 'rgba(60, 50, 40, 0.012)' : 'rgba(55, 45, 35, 0.014)';
            for (let i = 1; i <= fiberCount; i++) {
                const x = fract(i * R2A) * w;
                const y = fract(i * R2B) * h;
                const ang = i * GOLD;
                if (paint) {
                    const len = 2 + dU(i, 7.3) * 12;
                    paperCtx.lineWidth = 0.05 + dU(i, 11.1) * 0.15;
                    paperCtx.beginPath();
                    paperCtx.moveTo(x, y);
                    paperCtx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
                    paperCtx.stroke();
                } else {
                    const len = 25 + dU(i, 7.3) * 110;
                    paperCtx.lineWidth = 0.18 + dU(i, 11.1) * 0.65;
                    paperCtx.beginPath();
                    paperCtx.moveTo(x, y);
                    paperCtx.bezierCurveTo(
                        x + Math.cos(ang) * (len / 3) + dS(i, 1.2) * 4,
                        y + Math.sin(ang) * (len / 3) + dS(i, 2.3) * 4,
                        x + Math.cos(ang) * (len * 2 / 3) + dS(i, 3.4) * 4,
                        y + Math.sin(ang) * (len * 2 / 3) + dS(i, 4.5) * 4,
                        x + Math.cos(ang) * len,
                        y + Math.sin(ang) * len
                    );
                    paperCtx.stroke();
                }
            }

            // motes — a second R2 lane
            const moteCount = Math.floor(area / (paint ? 600 : 130));
            paperCtx.fillStyle = paint ? 'rgba(120, 105, 85, 0.015)' : 'rgba(130, 115, 95, 0.02)';
            for (let i = 1; i <= moteCount; i++) {
                const rx = fract((i + 0.5) * R2A) * w;
                const ry = fract((i + 0.5) * R2B) * h;
                paperCtx.beginPath();
                paperCtx.arc(rx, ry, dU(i, 5.5) * (paint ? 1.5 : 1.6), 0, Math.PI * 2);
                paperCtx.fill();
            }

            // velvet vignetting
            const grad = paperCtx.createRadialGradient(
                w / 2, h / 2, Math.min(w, h) * (paint ? 0.25 : 0.22),
                w / 2, h / 2, Math.max(w, h) * (paint ? 0.65 : 0.6));
            grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            grad.addColorStop(1, paint ? 'rgba(165, 155, 140, 0.15)' : 'rgba(170, 160, 145, 0.12)');
            paperCtx.fillStyle = grad;
            paperCtx.fillRect(0, 0, w, h);

            drawHankoOnPaper();
        }

        function drawHankoOnPaper() {
            const w = paperCanvas.width;
            const h = paperCanvas.height;
            const M = modeCfg();
            const paint = (MODE === 'paint');
            const size = Math.max(paint ? 45 : 48, Math.min(w, h) * (paint ? 0.065 : 0.06));
            const x = w - size - 40;
            const y = h - size - 40;

            paperCtx.save();
            paperCtx.fillStyle = M.hankoColor;
            paperCtx.strokeStyle = M.hankoColor;
            paperCtx.lineWidth = size * (paint ? 0.025 : 0.06);
            const pad = size * 0.08;
            paperCtx.strokeRect(x + pad, y + pad, size - pad * 2, size - pad * 2);

            paperCtx.font = `bold ${size * (paint ? 0.52 : 0.55)}px "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif`;
            paperCtx.textAlign = 'center';
            paperCtx.textBaseline = 'middle';
            paperCtx.fillText(M.hankoSymbol, x + size / 2, y + size / 2 + size * (paint ? 0.035 : 0.03));

            // board's seal is distressed; paint's is clean
            if (!paint) {
                paperCtx.globalCompositeOperation = 'destination-out';
                paperCtx.fillStyle = 'rgba(0,0,0,0.7)';
                for (let i = 1; i <= 120; i++) {
                    
                    paperCtx.fill();
                }
            }
            paperCtx.restore();
        }

        // ═══════════════ BOARD: RIBBON BRUSH ═══════════════
        // The live stroke is redrawn each frame as ONE filled path: an oriented
        // ellipse joint at every point plus quads connecting the edges. One fill
        // = one composite: no overlap darkening, no dot texture.
        function brushW(press, contact) {
            return (CFG.wMin + (CFG.wMax - CFG.wMin) * Math.pow(press, CFG.pressGamma)) * contact;
        }

        function beginStroke(x, y, t, group, press, contact) {
            const p = hasPressure ? (press || 0.5) : 0.5;
            const c = contact > 0
                ? Math.min(CFG.contactMax, Math.max(CFG.contactMin, contact / CFG.contactRef))
                : 1;
            const w0 = brushW(p, c);
            live = {
                born: t,
                group: group ?? ++groupSeq,
                lastX: x, lastY: y, lastT: t,
                smSpd: 0, smPress: p, smContact: c, nibAng: CFG.nibAngle,
                alpha: null,
                pts: [{ x, y, w: w0, nib: CFG.nibAngle, dry: 0 }],
                carryNib: false,
                minX: x - (w0 * 1.4 + 3), minY: y - (w0 * 1.4 + 3),
                maxX: x + (w0 * 1.4 + 3), maxY: y + (w0 * 1.4 + 3),
                shedAt: t,
                trail: [{ x, y, t }],
            };
            liveDirty = true;
        }

        function extendStroke(x, y, t, press, contact, tiltA) {
            if (!live) return;

            live.trail.push({ x, y, t });
            if (live.trail.length > 6) live.trail.shift();

            const dx = x - live.lastX, dy = y - live.lastY;
            const dist = Math.hypot(dx, dy);
            if (dist < 0.75) return;

            const dt = Math.min(60, Math.max(4, t - live.lastT));
            const raw = dist / dt;
            const first = live.pts.length === 1;
            const fresh = first && !live.carryNib;
            live.smSpd = fresh ? raw : live.smSpd + (raw - live.smSpd) * CFG.speedSmooth;
            const spd = live.smSpd;

            // pressure: real force when hardware gives it, speed-derived when not
            const pTarget = hasPressure ? press : 1 / (1 + spd * CFG.fallbackSpeedK);
            live.smPress = fresh ? pTarget : live.smPress + (pTarget - live.smPress) * CFG.touchSmooth;

            // contact patch: finger pad vs fingertip
            const cTarget = contact > 0
                ? Math.min(CFG.contactMax, Math.max(CFG.contactMin, contact / CFG.contactRef))
                : 1;
            live.smContact = fresh ? cTarget : live.smContact + (cTarget - live.smContact) * CFG.touchSmooth;

            // nib orientation: fixed chisel by default; Pencil tilt overrides;
            // nibFollow blends toward the motion direction if you want trailing bristles
            const dirAng = Math.atan2(dy, dx);
            let nibTarget;
            if (tiltA !== null && tiltA !== undefined) {
                nibTarget = tiltA;
            } else if (CFG.nibFollow <= 0) {
                nibTarget = CFG.nibAngle;
            } else if (CFG.nibFollow >= 1) {
                nibTarget = dirAng;
            } else {
                const d = Math.atan2(Math.sin(dirAng - CFG.nibAngle), Math.cos(dirAng - CFG.nibAngle));
                nibTarget = CFG.nibAngle + d * CFG.nibFollow;
            }
            if (fresh) live.nibAng = nibTarget;
            const dA = Math.atan2(Math.sin(nibTarget - live.nibAng), Math.cos(nibTarget - live.nibAng));
            live.nibAng += dA * CFG.nibLag;

            // this stroke's water load follows pressure slowly
            const o = CFG.oMin + (CFG.oMax - CFG.oMin) * Math.pow(live.smPress, CFG.inkGamma);
            live.alpha = live.alpha === null ? o : live.alpha + (o - live.alpha) * CFG.alphaSmooth;

            const i = live.pts.length;
            const w = brushW(live.smPress, live.smContact)
                * (1 + CFG.wobble * Math.sin(i * 0.61));
            const dry = Math.max(0, spd - CFG.dryStart);

            live.pts.push({ x, y, w, nib: live.nibAng, dry });
            if (first) {
                // retro-fit the start point so the head matches the body
                live.pts[0].w = w;
                live.pts[0].nib = live.nibAng;
            }
            liveDirty = true;

            const m = w * 1.4 + 3;
            live.minX = Math.min(live.minX, x - m);
            live.minY = Math.min(live.minY, y - m);
            live.maxX = Math.max(live.maxX, x + m);
            live.maxY = Math.max(live.maxY, y + m);

            if (spd > CFG.shedSpeed && t - live.shedAt > CFG.shedEveryMs) {
                live.shedAt = t;
                spawnSplat(x, y, dirAng, spd * 0.4, live.group);
            }

            live.lastX = x; live.lastY = y; live.lastT = t;

            // long strokes commit in segments so their oldest water dries first
            if (t - live.born > CFG.autoSplitMs || live.pts.length > 500) {
                const keep = {
                    g: live.group, s: live.smSpd, tr: live.trail,
                    p: live.smPress, c: live.smContact, n: live.nibAng, a: live.alpha,
                };
                commitLive();
                beginStroke(x, y, t, keep.g, keep.p, 0);
                live.smSpd = keep.s;
                live.trail = keep.tr;
                live.smPress = keep.p;
                live.smContact = keep.c;
                live.nibAng = keep.n;
                live.alpha = keep.a;
                live.carryNib = true;
                live.pts[0].w = brushW(keep.p, keep.c);
                live.pts[0].nib = keep.n;
            }
        }

        function drawLive() {
            activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
            if (!live || !live.pts.length) return;

            const P = live.pts;
            const n = P.length;
            activeCtx.fillStyle = inkAt(live.alpha === null
                ? CFG.oMin + (CFG.oMax - CFG.oMin) * Math.pow(live.smPress, CFG.inkGamma)
                : live.alpha);
            activeCtx.beginPath();

            const NX = new Array(n), NY = new Array(n);
            const LX = new Array(n), LY = new Array(n);
            const RX = new Array(n), RY = new Array(n);

            for (let i = 0; i < n; i++) {
                const p = P[i];
                const p0 = P[Math.max(0, i - 1)];
                const p1 = P[Math.min(n - 1, i + 1)];
                let tx = p1.x - p0.x, ty = p1.y - p0.y;
                const tl = Math.hypot(tx, ty);
                if (tl < 1e-6) {
                    // degenerate tangent (reversal) — reuse the previous normal
                    NX[i] = i > 0 ? NX[i - 1] : 0;
                    NY[i] = i > 0 ? NY[i - 1] : 1;
                } else {
                    NX[i] = -ty / tl;
                    NY[i] = tx / tl;
                }
                const nx = NX[i], ny = NY[i];

                const dryK = Math.min(1, p.dry);

                // smooth deterministic streak fields (paired incommensurate sines)
                const s1 = 0.5 + 0.5 * Math.sin(i * 0.83 + 0.9 * Math.sin(i * 0.19));
                const s2 = 0.5 + 0.5 * Math.sin(i * 0.71 + 1.1 * Math.sin(i * 0.23) + 2.4);
                const s3 = 0.5 + 0.5 * Math.sin(i * 0.37 + 1.7 * Math.sin(i * 0.11));

                // when very dry, the brush starves — gaps open ALONG the stroke
                let gapMul = 1;
                if (dryK > 0 && s3 > CFG.dryBreak) {
                    gapMul = 1 - dryK * (s3 - CFG.dryBreak) / (1 - CFG.dryBreak);
                }

                const a = Math.max(0, p.w * 0.5 * gapMul);
                const b = Math.max(0, Math.min(a, Math.max(0.4 * gapMul, a * CFG.nibAspect)));

                // ellipse radius along the normal (chisel: thin when moving along the nib)
                const cn = Math.cos(p.nib), sn = Math.sin(p.nib);
                const cosf = nx * cn + ny * sn;
                const sinf = -nx * sn + ny * cn;
                const denom = Math.hypot(b * cosf, a * sinf);
                const r = denom > 1e-6 ? (a * b) / denom : b;

                // dryness roughens each edge independently (smooth, deterministic)
                const eL = 1 - dryK * CFG.dryRag * (0.3 + 0.7 * s1);
                const eR = 1 - dryK * CFG.dryRag * (0.3 + 0.7 * s2);
                LX[i] = p.x + nx * r * eL; LY[i] = p.y + ny * r * eL;
                RX[i] = p.x - nx * r * eR; RY[i] = p.y - ny * r * eR;

                // oriented ellipse joint (own subpath — clockwise, matching the quads)
                if (a > 0.01) {
                    activeCtx.moveTo(p.x + a * cn, p.y + a * sn);
                    activeCtx.ellipse(p.x, p.y, a, b, p.nib, 0, Math.PI * 2);
                }
            }

            // connective quads (clockwise: L→R at i, R→L at i+1)
            for (let i = 0; i < n - 1; i++) {
                activeCtx.moveTo(LX[i], LY[i]);
                activeCtx.lineTo(RX[i], RY[i]);
                activeCtx.lineTo(RX[i + 1], RY[i + 1]);
                activeCtx.lineTo(LX[i + 1], LY[i + 1]);
                activeCtx.closePath();
            }

            activeCtx.fill();
        }

        function commitLive() {
            if (!live) return;
            if (live.pts.length > 0) {
                drawLive();
                const x = Math.max(0, Math.floor(live.minX));
                const y = Math.max(0, Math.floor(live.minY));
                const x2 = Math.min(canvas.width, Math.ceil(live.maxX));
                const y2 = Math.min(canvas.height, Math.ceil(live.maxY));
                if (x2 > x && y2 > y) {
                    const c = document.createElement('canvas');
                    c.width = x2 - x;
                    c.height = y2 - y;
                    c.getContext('2d').drawImage(activeCanvas, x, y, c.width, c.height, 0, 0, c.width, c.height);
                    strokes.push({ canvas: c, x, y, born: live.born, group: live.group });
                    if (strokes.length > 90) strokes.shift();
                }
            }
            activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
            live = null;
            liveDirty = false;
        }

        function endStroke(tEnd) {
            if (!live) return;

            // a bare tap (tray gesture) leaves no mark; a held touch leaves a dab
            if (live.pts.length === 1 && tEnd - live.born < CFG.tapMs) {
                activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
                live = null;
                liveDirty = false;
                return;
            }

            const trail = live.trail, group = live.group;
            commitLive();
            if (trail.length >= 3) {
                const a = trail[trail.length - 1];
                const b = trail[Math.max(0, trail.length - 5)];
                const dt = (a.t - b.t) || 1;
                const spd = Math.hypot(a.x - b.x, a.y - b.y) / dt;
                if (spd > CFG.flickSpeed) {
                    spawnSplat(a.x, a.y, Math.atan2(a.y - b.y, a.x - b.x), spd, group);
                    ripple = { x: a.x, y: a.y, radius: 1.5, opacity: 0.56 };
                }
            }
        }

        // ═══════════════ PAINT: POOLING STAMP BRUSH ═══════════════
        function paintSegment(p1, p2) {
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
            // clamp dt: Date.now() jitter is what made strokes lumpy at speed
            const dt = Math.min(40, Math.max(8, (p2.t - p1.t) || 16));
            const raw = dist / dt;

            // low-pass the speed so width changes glide instead of stepping
            const prev = smSpd || raw;
            smSpd = prev + (raw - prev) * PAINT.speedSmooth;

            // width and saturation, dynamically, from movement speed
            const getSpecs = (spd) => {
                const range = PAINT.maxBrushWidth - PAINT.minBrushWidth;
                const w = PAINT.minBrushWidth + range / (1.0 + spd * 4.5);
                const opacity = 0.15 + 0.75 / (1.0 + spd * 7.0);
                return { w, opacity };
            };

            // High-precision spacing prevents stamp-overlap "bumpiness"
            const stepDist = 0.8;
            const steps = Math.max(1, Math.floor(dist / stepDist));

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = p1.x + (p2.x - p1.x) * t;
                const y = p1.y + (p2.y - p1.y) * t;

                // glide from the previous smoothed speed to the new one
                const spd = prev + (smSpd - prev) * t;
                const { w, opacity } = getSpecs(spd);

                inkCtx.beginPath();
                inkCtx.arc(x, y, w, 0, Math.PI * 2);
                inkCtx.fillStyle = inkAt(opacity * 0.28); // Overlapping stamps blend smoothly
                inkCtx.fill();
            }
        }

        function applyEvaporation() {
            if (PAINT.evaporationSpeed <= 0) return;
            inkCtx.save();
            inkCtx.globalCompositeOperation = 'destination-out';
            inkCtx.fillStyle = `rgba(0, 0, 0, ${PAINT.evaporationSpeed})`;
            inkCtx.fillRect(0, 0, inkCanvas.width, inkCanvas.height);
            inkCtx.restore();
        }

        function snapUndo() {
            undoStack.push(inkCanvas.toDataURL());
            if (undoStack.length > 20) undoStack.shift();
        }

        function performUndo() {
            if (!undoStack.length) return;
            const img = new Image();
            img.onload = () => {
                inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
                inkCtx.drawImage(img, 0, 0);
            };
            img.src = undoStack.pop();
        }

        function paintFlick() {
            const last = pts[pts.length - 1];
            const prev = pts[Math.max(0, pts.length - 8)];
            const dx = last.x - prev.x;
            const dy = last.y - prev.y;
            const dt = (last.t - prev.t) || 1;
            const spd = Math.hypot(dx, dy) / dt * 15;
            const ang = Math.atan2(dy, dx);

            if (spd > 1.2) {
                spawnSplat(last.x, last.y, ang, spd, 0);
                ripple = { x: last.x, y: last.y, radius: 1.0, opacity: 0.6 };
            }
        }

        // ═══════════════ SPLATTER (shared) ═══════════════
        // Both engines throw the same ink; only the surface it lands on
        // differs. In paint that surface is the one persistent layer, in
        // board it's a timed canvas that evaporates with its stroke — so
        // makeSplatCanvas hands back a "group" either way and the physics
        // never has to know which engine it's in.
        function makeSplatCanvas(cx, cy, reach, group) {
            if (MODE === 'paint') {
                return { ctx: inkCtx, x: 0, y: 0, group };
            }
            reach = Math.min(280, Math.max(24, reach));
            const x = Math.max(0, Math.floor(cx - reach));
            const y = Math.max(0, Math.floor(cy - reach));
            const x2 = Math.min(canvas.width, Math.ceil(cx + reach));
            const y2 = Math.min(canvas.height, Math.ceil(cy + reach * 1.25));
            const c = document.createElement('canvas');
            c.width = Math.max(1, x2 - x);
            c.height = Math.max(1, y2 - y);
            const grp = { canvas: c, ctx: c.getContext('2d'), x, y, born: performance.now(), group };
            strokes.push(grp);
            if (strokes.length > 90) strokes.shift();
            return grp;
        }

        function spawnSplat(px, py, angle, spd, group) {
            // seeded by place + direction — the same flick makes the same splash
            const seed = Math.floor(px) * 3.1 + Math.floor(py) * 7.7 + Math.floor(angle * 57.3) * 13.9;
            const { r, g, b } = inkRgb;
            const paint = (MODE === 'paint');
            const cap = paint ? 45 : 60;
            const cnt = paint
                ? Math.floor(Math.min(cap, spd * (2 + dU(seed, 0.77) * 2)))
                : Math.floor(Math.min(cap, spd * CFG.splatCount));
            if (cnt < 3) return;

            const scaleMod = paint ? 0.45 : 1;
            const refSize = paint ? Math.min(140, spd * 10.0) * scaleMod : Math.min(52, spd * 34);
            const grp = makeSplatCanvas(px, py, spd * CFG.splatReach * 13 + refSize + 16, group);

            for (let i = 0; i < cnt; i++) {
                if (paint) {
                    const gauss = dG(seed, i * 2.39996);
                    const satAngle = angle + gauss * 0.25;
                    const satVel = (spd * 0.4) + (dU(seed + 1.3, i) * spd * 0.5);
                    const vx = Math.cos(satAngle) * satVel * scaleMod;
                    const vy = Math.sin(satAngle) * satVel * scaleMod;
                    const rad = Math.max(0.4, dU(seed + 2.6, i) * refSize * 0.08);
                    addParticle(px, py, vx, vy, rad, r, g, b, grp, seed + i);
                } else {
                    const a = angle + dG(seed, i * 2.39996) * 0.34;
                    const v = spd * CFG.splatReach * (0.5 + dU(seed + 1.3, i) * 0.8);
                    const rad = Math.max(0.35, (0.15 + dU(seed + 2.6, i) * 0.85) * refSize * CFG.splatSize);
                    addParticle(px, py, Math.cos(a) * v, Math.sin(a) * v, rad, r, g, b, grp, seed + i);
                }
            }

            // board also throws an ambient mist ring — golden-angle distribution
            if (!paint) {
                const halo = Math.floor(cnt * 0.22);
                for (let i = 0; i < halo; i++) {
                    const ha = i * GOLD + seed;
                    const hd = refSize * (0.25 + dU(seed + 4.1, i) * 0.75);
                    addParticle(
                        px + Math.cos(ha) * hd, py + Math.sin(ha) * hd,
                        dS(seed + 5, i) * 0.22, dS(seed + 6, i) * 0.22,
                        0.12 + dU(seed + 7, i) * 0.42, r, g, b, grp, seed + i * 1.7
                    );
                }
            }
        }

        class InkParticle {
            constructor(x, y, vx, vy, radius, r, g, b, grp, id) {
                const paint = (MODE === 'paint');
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.radius = radius; this.r = r; this.g = g; this.b = b;
                this.grp = grp; this.id = id; this.group = grp.group;
                this.paint = paint;
                this.alpha = paint ? 0.9 : 0.88;
                this.friction = paint ? 0.93 : 0.9;
                this.gravity = paint ? 0 : 0.002;
                this.decay = paint
                    ? 0.003 + dU(id, 9.4) * 0.008
                    : 0.006 + dU(id, 9.4) * 0.004;
                this.crown = !paint && Math.hypot(vx, vy) > CFG.crownV;
                this.settled = false;
            }

            update() {
                if (this.settled) return;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.alpha -= this.decay;
                const spd = Math.hypot(this.vx, this.vy);

                // a hard landing kicks up a pair of micro-droplets (board only)
                if (this.crown && spd < 0.9) {
                    this.crown = false;
                    for (let f = 0; f < 2; f++) {
                        const a = Math.atan2(this.vy, this.vx) + (f ? 0.9 : -0.9) + dS(this.id, f) * 0.3;
                        addParticle(
                            this.x, this.y,
                            Math.cos(a) * 0.9, Math.sin(a) * 0.9 - 0.3,
                            this.radius * 0.4, this.r, this.g, this.b, this.grp, this.id * 3.7 + f
                        );
                    }
                }

                if (this.alpha <= 0.03 || spd < (this.paint ? 0.05 : 0.06)) {
                    this.settled = true;
                    const c = this.grp.ctx;
                    c.save();
                    c.globalAlpha = this.paint
                        ? Math.max(0.02, this.alpha * 0.7)
                        : Math.max(0.01, this.alpha * 0.9);
                    c.fillStyle = `rgba(${this.r},${this.g},${this.b},1)`;
                    c.beginPath();
                    const rr = this.paint
                        ? this.radius * (0.8 + dU(this.id, 3.3) * 0.4)
                        : this.radius * 1.5;
                    c.arc(this.x - this.grp.x, this.y - this.grp.y, rr, 0, Math.PI * 2);
                    c.fill();
                    c.restore();
                }
            }

            draw(g) {
                if (this.settled) return;
                const spd = Math.hypot(this.vx, this.vy);
                g.fillStyle = g.strokeStyle = `rgba(${this.r},${this.g},${this.b},${this.alpha})`;
                // board's fast droplets streak like comets; paint's stay round
                if (!this.paint && spd > 0.8) {
                    g.lineWidth = this.radius * 1.7;
                    g.lineCap = 'round';
                    g.beginPath();
                    g.moveTo(this.x - this.vx * 2.2, this.y - this.vy * 2.2);
                    g.lineTo(this.x, this.y);
                    g.stroke();
                } else {
                    g.beginPath();
                    g.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    g.fill();
                }
            }
        }

        function addParticle(x, y, vx, vy, radius, r, g, b, grp, id) {
            if (particles.length >= CFG.maxParticles) return;
            particles.push(new InkParticle(x, y, vx, vy, radius, r, g, b, grp, id));
        }

        // ═══════════════ RENDER LOOP ═══════════════
        function frame(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(paperCanvas, 0, 0);

            const paint = (MODE === 'paint');

            // 1 — build the living ink layer
            compCtx.clearRect(0, 0, compCanvas.width, compCanvas.height);
            if (paint) {
                compCtx.drawImage(inkCanvas, 0, 0);
            } else {
                for (let i = strokes.length - 1; i >= 0; i--) {
                    if (now - strokes[i].born >= CFG.lifespan) strokes.splice(i, 1);
                }
                if (live && liveDirty) {
                    drawLive();
                    liveDirty = false;
                }
                for (const s of strokes) {
                    compCtx.globalAlpha = fadeAlpha(now - s.born);
                    compCtx.drawImage(s.canvas, s.x, s.y);
                }
                if (live) {
                    compCtx.globalAlpha = fadeAlpha(now - live.born);
                    compCtx.drawImage(activeCanvas, 0, 0);
                }
                compCtx.globalAlpha = 1;
            }

            // 2 — wet bleed halo
            bleedCtx.clearRect(0, 0, bleedCanvas.width, bleedCanvas.height);
            bleedCtx.save();
            bleedCtx.filter = `blur(${paint ? PAINT.bleedStrength : CFG.bleedPx}px)`;
            bleedCtx.globalAlpha = paint ? PAINT.bleedOpacity : CFG.bleedAlpha;
            bleedCtx.drawImage(compCanvas, 0, 0);
            bleedCtx.restore();

            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(bleedCanvas, 0, 0);
            ctx.drawImage(compCanvas, 0, 0);
            ctx.globalCompositeOperation = 'source-over';

            // 3 — airborne droplets
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.settled && (p.paint ? p.alpha <= 0.02 : true)) particles.splice(i, 1);
            }

            // 4 — ripple ring
            if (ripple) {
                ctx.save();
                ctx.strokeStyle = `rgba(${inkRgb.r},${inkRgb.g},${inkRgb.b},${ripple.opacity})`;
                ctx.lineWidth = paint ? 0.8 : 0.7;
                ctx.beginPath();
                ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
                ctx.stroke();
                ripple.radius += paint ? 2.2 : 2.6;
                ripple.opacity -= paint ? 0.015 : 0.018;
                if (ripple.opacity <= 0) ripple = null;
                ctx.restore();
            }

            // 5 — paint's optional slow dry-up
            if (paint) applyEvaporation();

            requestAnimationFrame(frame);
        }

        // ═══════════════ INPUT ═══════════════
        function inputStart(x, y, t, press, contact) {
            if (!hintGone) {
                hint.classList.add('gone');
                hintGone = true;
            }
            closeTray();
            drawing = true;
            if (MODE === 'paint') {
                snapUndo();
                smSpd = 0;
                pts = [{ x, y, t }];
            } else {
                beginStroke(x, y, t, null, press, contact);
            }
        }

        function inputMove(x, y, t, press, contact, tiltA) {
            if (!drawing) return;
            if (MODE === 'paint') {
                const last = pts[pts.length - 1];
                if (Math.hypot(x - last.x, y - last.y) < 1.0) return;
                const p = { x, y, t };
                pts.push(p);
                paintSegment(last, p);
            } else {
                extendStroke(x, y, t, press, contact, tiltA);
            }
        }

        function inputEnd() {
            if (!drawing) return;
            drawing = false;
            if (MODE === 'paint') {
                if (pts.length >= 3) paintFlick();
                pts = [];
            } else {
                endStroke(performance.now());
            }
        }

        function ptTilt(e) {
            return (Math.abs(e.tiltX || 0) + Math.abs(e.tiltY || 0) > 2)
                ? Math.atan2(e.tiltY, e.tiltX)
                : null;
        }
        function ptContact(e) {
            return ((e.width || 0) + (e.height || 0)) * 0.5;
        }
        function sniffPressure(pointerType, p) {
            if (pointerType === 'pen' || (p > 0 && p !== 0.5 && p !== 1)) hasPressure = true;
        }

        if (window.PointerEvent) {
            let lastMoveT = 0;
            canvas.addEventListener('pointerdown', e => {
                if (!e.isPrimary || e.target !== canvas) return;
                e.preventDefault();
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                sniffPressure(e.pointerType, e.pressure);
                lastMoveT = e.timeStamp;
                inputStart(e.clientX, e.clientY, e.timeStamp, e.pressure, ptContact(e));
            });
            canvas.addEventListener('pointermove', e => {
                if (!drawing || !e.isPrimary) return;
                sniffPressure(e.pointerType, e.pressure);
                const list = (e.getCoalescedEvents && e.getCoalescedEvents().length)
                    ? e.getCoalescedEvents() : [e];
                // coalesced samples often share one timestamp — spread the parent
                // event's dt across them so speed estimates stay sane
                const t1 = e.timeStamp;
                const t0 = lastMoveT || (t1 - 16);
                const step = Math.max(0, (t1 - t0) / list.length);
                for (let k = 0; k < list.length; k++) {
                    const ev = list[k];
                    inputMove(ev.clientX, ev.clientY, t0 + step * (k + 1),
                        ev.pressure, ptContact(ev), ptTilt(ev));
                }
                lastMoveT = t1;
            });
            canvas.addEventListener('pointerup', inputEnd);
            canvas.addEventListener('pointercancel', () => {
                if (drawing) {
                    drawing = false;
                    if (MODE === 'board') commitLive(); else pts = [];
                }
            });
        } else {
            canvas.addEventListener('mousedown', e => {
                if (e.target !== canvas) return;
                e.preventDefault();
                inputStart(e.clientX, e.clientY, performance.now(), 0.5, 0);
            });
            window.addEventListener('mousemove', e => inputMove(e.clientX, e.clientY, performance.now(), 0.5, 0, null));
            window.addEventListener('mouseup', inputEnd);
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.touches[0];
                if (t.force > 0 && t.force < 1) hasPressure = true;
                inputStart(t.clientX, t.clientY, e.timeStamp || performance.now(),
                    t.force || 0.5, (t.radiusX || 0) + (t.radiusY || 0));
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0];
                if (t.force > 0 && t.force < 1) hasPressure = true;
                inputMove(
                    t.clientX, t.clientY, e.timeStamp || performance.now(),
                    t.force || 0.5,
                    (t.radiusX || 0) + (t.radiusY || 0),
                    null
                );
            }, { passive: false });
            canvas.addEventListener('touchend', inputEnd, { passive: false });
        }

        // ═══════════════ MODE SWITCH ═══════════════
        // The two engines store marks in incompatible ways — one persistent
        // layer vs a pile of individually-timed ones — so a switch wipes the
        // sheet rather than pretending it can carry them across. Different
        // paper, different seal, clean start.
        function clearAll() {
            strokes = [];
            particles = [];
            ripple = null;
            drawing = false;
            live = null;
            liveDirty = false;
            pts = [];
            smSpd = 0;
            undoStack = [];
            activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
            inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
        }

        function flashMode() {
            const paint = (MODE === 'paint');
            modeFlash.innerHTML = paint
                ? 'paint<span>it stays</span>'
                : 'board<span>it fades</span>';
            modeFlash.classList.add('show');
            clearTimeout(flashTimer);
            flashTimer = setTimeout(() => modeFlash.classList.remove('show'), 1100);
        }

        function setMode(m) {
            if (m === MODE) return;
            MODE = m;
            document.getElementById('btnMode').textContent = m;
            clearAll();
            generateWashiPaper();
            flashMode();
        }

        document.getElementById('btnMode').addEventListener('click', () => {
            setMode(MODE === 'board' ? 'paint' : 'board');
            clearTimeout(trayTimer);
            trayTimer = setTimeout(closeTray, 2000);
        });

        // ═══════════════ TRAY LOGIC ═══════════════
        function openTray() {
            clearTimeout(trayTimer);
            tray.classList.add('visible');
            trayOpen = true;
            trayTimer = setTimeout(closeTray, 4000);
        }

        function closeTray() {
            clearTimeout(trayTimer);
            tray.classList.remove('visible');
            trayOpen = false;
        }

        let tapCount = 0,
            tapTimer = null;
        canvas.addEventListener('touchstart', e => {
            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 320);
            if (tapCount >= 2) {
                tapCount = 0;
                openTray();
            }
        }, { passive: true });

        canvas.addEventListener('dblclick', openTray);

        let touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener('touchend', e => {
            const dy = touchStartY - e.changedTouches[0].clientY;
            if (dy > 55 && touchStartY > window.innerHeight * 0.75) openTray();
        }, { passive: true });

        tray.addEventListener('pointerenter', () => clearTimeout(trayTimer));
        tray.addEventListener('pointerleave', () => { trayTimer = setTimeout(closeTray, 2000); });

        // ═══════════════ SWATCH SELECTION ═══════════════
        document.querySelectorAll('#tray .swatch').forEach(sw => {
            sw.addEventListener('click', () => {
                setInkColor(sw.dataset.ink);
                document.querySelectorAll('#tray .swatch').forEach(s => s.classList.remove('active'));
                sw.classList.add('active');
                clearTimeout(trayTimer);
                trayTimer = setTimeout(closeTray, 8000);
            });
        });

        // ═══════════════ BUTTON ACTIONS ═══════════════
        document.getElementById('btnUndo').addEventListener('click', () => {
            if (MODE === 'paint') {
                performUndo();
            } else if (strokes.length) {
                // lift the whole last mark — stroke plus its spray
                const g = strokes[strokes.length - 1].group;
                strokes = strokes.filter(s => s.group !== g);
                particles = particles.filter(p => p.group !== g);
            }
            clearTimeout(trayTimer);
            trayTimer = setTimeout(closeTray, 8000);
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            clearAll();
            generateWashiPaper();
            closeTray();
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = (MODE === 'paint' ? 'living_water_stone_' : 'water_on_stone_') + Date.now() + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
            clearTimeout(trayTimer);
            trayTimer = setTimeout(closeTray, 8000);
        });

        // ═══════════════ SIZING & RESIZE ═══════════════
        function resize() {
            // paint's layer is pixels, so it survives a resize; board's marks
            // are geometry that was already rasterised, so they don't
            const keep = document.createElement('canvas');
            keep.width = inkCanvas.width;
            keep.height = inkCanvas.height;
            keep.getContext('2d').drawImage(inkCanvas, 0, 0);

            if (drawing) {
                drawing = false;
                if (MODE === 'board') commitLive(); else pts = [];
            }

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setupBuffers();
            generateWashiPaper();
            inkCtx.drawImage(keep, 0, 0);
        }

        // ═══════════════ BOOTSTRAP ═══════════════
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setupBuffers();
            document.getElementById('btnMode').textContent = MODE;
            generateWashiPaper();
            requestAnimationFrame(frame);
        }

        init();
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
